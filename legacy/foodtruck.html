<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food truck</title>
</head>
<body>
<script>/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, page shell.
   A figure page loads this file, then calls mountFigure({...}).
   See BRIEF.md for the drawing contract and conventions.
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* VIEW turns the object in 90° steps about a vertical axis through its centre (RC):
   0 = front (+x) and left (+y) faces toward the viewer, 1 = turned once (the +y side becomes the front)…
   Figures keep modelling in their own coordinates; P / Dv / vis / tone / depthOf all apply the turn. */
let VIEW = 0, RC = [0, 0];
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];                 // the views the UI offers: front and back (figures still draw correctly in all four)
const rotV = ([x,y,z]) => { switch (VIEW & 3){ case 1: return [y,-x,z]; case 2: return [-x,-y,z]; case 3: return [-y,x,z]; default: return [x,y,z]; } };
const rotXY = (x,y) => { const r = rotV([x-RC[0], y-RC[1], 0]); return [r[0]+RC[0], r[1]+RC[1]]; };
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso, no turn
const P  = (x,y,z) => { const [a,b] = rotXY(x,y); return [(a-b)*C + OX, (a+b)*S - z + OY]; };
const Dv = (x,y,z) => { const [a,b,c] = rotV([x,y,z]); return [(a-b)*C, (a+b)*S - c]; };
// distance toward the viewer in the current view: draw parts with smaller depth first
const depthOf = p => { const [a,b] = rotXY(p[0],p[1]); return a + b + p[2]; };
// sort [{at:[x,y,z], svg}] back-to-front for the current view and join
const byDepth = parts => parts.filter(Boolean).sort((p,q) => depthOf(p.at) - depthOf(q.at)).map(p => p.svg).join('');
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
const tone  = (n,m) => { const d=dot(rotV(n),L);   return d>-.15 ? m.l : d>-.45 ? m.m : m.d; };   // exterior, follows the sun
const toneI = (n,m) => { const d=dot(rotV(n),LIN); return d>.6 ? m.l : d>.05 ? m.m : m.d; };      // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.4) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=1.2) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=1.2) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
const hullInk = (pts3,w=1.4) => ink(sp(hull(pts3.map(p=>P(...p)))), w);
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=1){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
const txM = (o, U, V) => `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
const castShadow = pts3 => fill(sp(hull(pts3.map(([x,y,z]) => { const [a,b] = rotXY(x,y); return P0(a+z*SH[0], b+z*SH[1], 0); }))), SHADOW);
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all
   figures match the reference zoom of the booth / vending machine (viewBox ≈ 585 units wide). */
const INK_REF_VB = 585;
let INK_K = 1;
const inkScale = svg => INK_K === 1 ? svg : svg.replace(/stroke-width="([\d.]+)"/g, (_, w) => `stroke-width="${(+w * INK_K).toFixed(2)}"`);

/* ---------- page shell ---------- */
const CORE_CSS = `
  :root{--paper:#f2efe7;--ink:#231e16;--muted:#857d6e;--rule:#ddd6c8}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background-color:var(--paper);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .33  .16 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
    overflow-x:hidden;color:var(--ink);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px}
  header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:13px;font-weight:600;margin:0;letter-spacing:.02em} header span{color:var(--muted)}
  #fig{width:100%;max-width:760px;height:auto;display:block;margin:4px 0 8px;user-select:none;overflow:visible}
  #fig [data-act]{cursor:pointer}
  #readout, .idea{display:none}   /* status line + big idea are off: the buttons and motion tell the story */
  .idea{width:100%;max-width:760px;margin:-6px 0 16px;font-size:12.5px;line-height:1.5;text-align:center;color:var(--ink)}
  .idea strong{letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-right:8px}
  #readout{position:relative;min-height:1.4em;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;text-align:center;text-shadow:0 0 3px var(--paper),0 0 6px var(--paper),0 0 10px var(--paper)}
  .stage{position:relative;width:100%;max-width:760px}
  .actions{position:absolute;top:4px;left:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;z-index:2;max-width:220px}
  .actions .cap{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 2px}
  .turn{position:absolute;right:0;bottom:2%;display:flex;align-items:center;gap:8px;z-index:2;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .turn span{min-width:7.5em;text-align:center}
  .tb{font:inherit;font-size:17px;line-height:1;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;padding:0}
  .tb:hover{background:#0000000d}
  #fig{transition:transform .14s ease-in}
  #fig.flip{transform:scaleX(.04)}
  #fig.dragging{cursor:grabbing}
  .stats{position:absolute;top:4px;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:2;text-align:right}
  .stat .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat.small .v{font-size:20px}
  .stat .v.bump{animation:bump .35s ease-out}
  @keyframes bump{0%{transform:scale(1.18)}100%{transform:none}}
  .stepwrap{position:relative;display:flex;align-items:center;gap:8px}
  .act{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap}
  .act:hover{background:color-mix(in srgb,var(--paper) 92%,var(--ink))}
  .act .car{margin-left:6px;font-size:10px}
  .act:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .chips{display:none;flex-wrap:wrap;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);
    padding:8px;width:max-content;max-width:min(300px,62vw);position:absolute;left:calc(100% + 10px);top:-4px;z-index:3}
  .stepwrap.open .chips{display:flex}
  .chip{white-space:nowrap;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:4px 8px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .chip:hover{background:var(--accent,#f4b829);transform:translate(-1px,-1px)}
  .chip:disabled{opacity:.35;cursor:default;transform:none;background:var(--paper)}
  
  @media (max-width:560px){body{padding:14px 12px 24px}header span,.actions .cap{display:none}.actions{flex-direction:row;flex-wrap:wrap;gap:6px}.act{font-size:12px;padding:4px 11px}.turn{position:static;justify-content:flex-end;margin-top:4px}.stats{position:static;flex-direction:row;justify-content:flex-end;gap:18px;margin-bottom:4px}.actions{position:static;max-width:none;margin:6px 0 4px}.chips{left:0;top:calc(100% + 8px)}}
  .controls{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 28px;border-top:1px solid var(--rule);padding-top:16px}
  .ctl{display:flex;flex-direction:column;gap:6px}
  .ctl label{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  input[type=range]{width:100%;accent-color:var(--ink)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
  button:hover{background:#0000000d}
  .sw{width:26px;height:26px;padding:0;border-radius:50%} .sw[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}`;

const filterFor = k => `<filter id="hand" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="${(0.045/k).toFixed(4)}" numOctaves="2" seed="4" result="warp"/>
  <feDisplacementMap id="wob" in="SourceGraphic" in2="warp" scale="${(2.4*k).toFixed(2)}" xChannelSelector="R" yChannelSelector="G" result="wob"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.9/k).toFixed(4)}" numOctaves="3" seed="11" result="n1"/>
  <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .84  .3 0 0 0 .84  .3 0 0 0 .84  0 0 0 0 1" result="grain"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.012/k).toFixed(4)}" numOctaves="2" seed="7" result="n2"/>
  <feColorMatrix in="n2" type="matrix" values=".3 0 0 0 .85  .3 0 0 0 .85  .3 0 0 0 .85  0 0 0 0 1" result="blot"/>
  <feBlend in="wob" in2="grain" mode="multiply" result="g1"/><feBlend in="g1" in2="blot" mode="multiply" result="g2"/>
  <feComposite in="g2" in2="wob" operator="in"/></filter>`;

/* mountFigure({
     fig:'03', title:'Photo booth', hint:'click the curtain…',
     size:[W,D,H],                 // bounding box, used to frame the view (shadow range included)
     palette:'mustard',            // default PALS key
     state:{...},                  // figure state, merged into st (st.pal, st.az are built in)
     scene: (st, m) => svgString,  // m = current palette {l,m,d}
     readout: st => 'text',        // status line under the figure
     buttons: [{label, onClick(st, ui)}      // listed in the order the user should do them; shown numbered
               | {label, choices: st => [{label, onClick(st,ui), disabled?}]}],   // opens a picker
     stats: st => [{label, value, small?}],   // optional: big numbers top-right (credit, change, score)
     views: true,                  // optional: the figure supports turning (VIEW 0..3); adds ⟲ ⟳, drag and Q/E
     center: [x,y],                // optional: turning axis (default: middle of size)
     next: st => index,            // optional: which step is current (-1 while busy)
     acts: { name(st, el, ui){} },  // clicks on act(name, …) groups; el has dataset
     params(st, q){}               // optional: read URLSearchParams for screenshot states
   })  -> ui = { st, render, animate(stepFn), flash(text,ms) }
   animate(step): calls step(dt seconds) every frame and re-renders until step returns false. */
function mountFigure(cfg){
  document.title = cfg.title;
  const style = document.createElement('style'); style.textContent = CORE_CSS; document.head.appendChild(style);
  document.body.innerHTML = `
    <header><h1>Fig. ${cfg.fig} — ${cfg.title}</h1><span>${cfg.hint || ''}</span></header>
    <div class="stage">
      ${cfg.buttons && cfg.buttons.length ? `<div class="actions" id="btns"><div class="cap">${cfg.buttonsLabel || 'Try it'}</div></div>` : ''}
      ${cfg.stats ? '<div class="stats" id="stats"></div>' : ''}
      ${cfg.views ? '<div class="turn"><button class="tb" id="tl" title="Turn around (Q)">⟲</button><span id="vname">front</span><button class="tb" id="tr" title="Turn around (E)">⟳</button></div>' : ''}
      <svg id="fig" role="img" aria-label="${cfg.title}"><defs id="fdefs"></defs><g id="art" filter="url(#hand)"></g></svg>
    </div>
    <div id="readout"></div>
    ${cfg.idea ? `<p class="idea"><strong>The big idea</strong>${cfg.idea}</p>` : ''}
    <div class="controls">
      <div class="ctl"><label for="az">Light direction</label><input id="az" type="range" min="${AZ_MIN}" max="${AZ_MAX}" value="105"></div>
      <div class="ctl"><label for="wb">Hand-drawn wobble</label><input id="wb" type="range" min="0" max="7" step="0.1" value="2.4"></div>
      <div class="ctl"><label>Colour</label><div class="row" id="pals"></div></div>
    </div>`;
  const st = cfg.state || {};            // kept as the same object, so a figure may hold on to it
  if (!st.pal) st.pal = cfg.palette || 'mustard';
  if (st.az == null) st.az = 105;
  const q = new URLSearchParams(location.search);
  if (PALS[q.get('pal')]) st.pal = q.get('pal');
  if (q.has('az')) st.az = Math.min(AZ_MAX, Math.max(AZ_MIN, +q.get('az')));
  if (cfg.params) cfg.params(st, q);
  const view0 = cfg.views && q.has('view') ? (+q.get('view') === 2 ? 2 : 0) : 0;

  // frame on the object itself: centred, filling ~60% of the width / ~78% of the height of a 4:3 view.
  // The cast shadow is allowed to spill outside the frame (svg overflow is visible).
  const [W,D,H] = cfg.size, pts = [];
  OX = OY = 0; RC = cfg.center || [W/2, D/2];
  const turns = cfg.views ? TURNS : [0];
  for (const v of turns){ VIEW = v; for (const x of [0,W]) for (const y of [0,D]) for (const z of [0,H]) pts.push(P(x,y,z)); }
  VIEW = 0;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const bw = Math.max(...xs)-Math.min(...xs), bh = Math.max(...ys)-Math.min(...ys);
  const vbW = Math.max(bw/.6, bh/.78/.75), vbH = vbW*.75;
  OX = (vbW-bw)/2 - Math.min(...xs); OY = vbH*.05 - Math.min(...ys);   // sit a little high: shadows fall downward
  const svg = document.getElementById('fig');
  svg.setAttribute('viewBox', `0 0 ${f(vbW)} ${f(vbH)}`);
  INK_K = vbW / INK_REF_VB;
  document.getElementById('fdefs').innerHTML = filterFor(INK_K);

  const art = document.getElementById('art'), readout = document.getElementById('readout');
  const ui = { st };
  ui.render = () => { _clipN = 0; document.documentElement.style.setProperty('--accent', PALS[st.pal].l); art.innerHTML = inkScale(cfg.scene(st, PALS[st.pal])); if (!ui._flash) readout.textContent = cfg.readout ? cfg.readout(st) : ''; if (ui.drawStats) ui.drawStats(); };
  // big numbers in the top-right corner (credit, change, score…); a value that changes gets a little bump
  const statsEl = document.getElementById('stats'), prevStats = {};
  ui.drawStats = () => { if (!statsEl) return;
    const list = cfg.stats(st).filter(Boolean), html = list.map(x => `<div class="stat${x.small ? ' small' : ''}"><div class="k">${x.label}</div><div class="v" data-k="${x.label}">${x.value}</div></div>`).join('');
    if (statsEl._html !== html){ statsEl._html = html; statsEl.innerHTML = html;
      statsEl.querySelectorAll('.v').forEach(v => { if (prevStats[v.dataset.k] != null && prevStats[v.dataset.k] !== v.textContent) v.classList.add('bump'); prevStats[v.dataset.k] = v.textContent; }); } };
  let flashT = 0;
  ui.flash = (text, ms=1400) => { ui._flash = true; readout.textContent = text; clearTimeout(flashT); flashT = setTimeout(() => { ui._flash = false; ui.render(); }, ms); };
  ui.animate = step => { let last = performance.now();
    const loop = now => { const dt = Math.max(0, Math.min(.05,(now-last)/1000)); /* rAF time can precede the start stamp */ last = now; const more = step(dt) !== false; ui.render(); if (more) requestAnimationFrame(loop); };
    requestAnimationFrame(loop); };

  svg.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a || !cfg.acts || !cfg.acts[a.dataset.act]) return; cfg.acts[a.dataset.act](st, a, ui); ui.render(); });
  const btns = document.getElementById('btns');
  const stepEls = [];
  if (btns) cfg.buttons.forEach((b, i) => {
    const wrap = document.createElement('div'); wrap.className = 'stepwrap';
    const el = document.createElement('button'); el.className = 'act';
    el.innerHTML = `${b.label}${b.choices ? '<span class="car">▾</span>' : ''}`;
    wrap.appendChild(el); btns.appendChild(wrap); stepEls.push(el);
    if (!b.choices){ el.onclick = () => { closeChips(); b.onClick(st, ui); ui.render(); }; return; }
    const chips = document.createElement('div'); chips.className = 'chips'; wrap.appendChild(chips);
    el.onclick = e => { e.stopPropagation(); const open = !wrap.classList.contains('open'); closeChips();
      if (!open) return;
      chips.innerHTML = '';
      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip'; ch.textContent = c.label; ch.disabled = !!c.disabled;
        ch.onclick = ev => { ev.stopPropagation(); closeChips(); c.onClick(st, ui); ui.render(); }; chips.appendChild(ch); }
      wrap.classList.add('open'); };
  });
  function closeChips(){ document.querySelectorAll('.stepwrap.open').forEach(w => w.classList.remove('open')); }
  document.addEventListener('click', closeChips);

  ui.view = () => VIEW;
  if (cfg.views){
    const name = document.getElementById('vname');
    let busy = false;
    const setView = v => { VIEW = ((v % 4) + 4) % 4; name.textContent = VIEW_NAMES[VIEW]; ui.render(); };
    ui.turn = d => { if (busy) return; busy = true; svg.classList.add('flip');
      setTimeout(() => { const i = TURNS.indexOf(VIEW); setView(TURNS[(i + (d > 0 ? 1 : TURNS.length - 1)) % TURNS.length]); svg.classList.remove('flip'); setTimeout(() => busy = false, 150); }, 140); };
    document.getElementById('tl').onclick = () => ui.turn(-1);
    document.getElementById('tr').onclick = () => ui.turn(1);
    addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,textarea')) return;
      if (e.key === 'q' || e.key === 'Q') ui.turn(-1); if (e.key === 'e' || e.key === 'E') ui.turn(1); });
    // drag sideways on the figure to turn it; a real drag swallows the click that follows
    let x0 = null, dragged = false;
    svg.addEventListener('pointerdown', e => { x0 = e.clientX; dragged = false; });
    addEventListener('pointermove', e => { if (x0 == null) return; const dx = e.clientX - x0;
      if (Math.abs(dx) > 70){ dragged = true; svg.classList.add('dragging'); ui.turn(dx > 0 ? -1 : 1); x0 = e.clientX; } });
    addEventListener('pointerup', () => { x0 = null; svg.classList.remove('dragging'); });
    svg.addEventListener('click', e => { if (dragged){ e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);
    VIEW = view0; name.textContent = VIEW_NAMES[VIEW];
  }
  const az = document.getElementById('az'); az.value = st.az;
  az.oninput = e => { st.az = +e.target.value; setLight(st.az); ui.render(); };
  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);
  }
  setLight(st.az); ui.render();
  return ui;
}
</script>
<script>
/* ---------- geometry (x = depth, y = length, z = up) ---------- */
const W = 90, D = 220, Z0 = 16, ZT = 112, R = 10;      // body: width (depth), length, floor, roof, corner radius
const BY = 50;                                          // box body starts here (cab is y 0..BY)
const CABH = 96, CR = 26;                               // cab roof height, rounded windscreen corner
const HY0 = 76, HY1 = 166, HZ0 = 52, HZ1 = 100;         // serving hatch on the +x face
const HINGE = 110, ALEN = HINGE - HZ0; const AOPEN = 150;     // awning: top hinge, length, open angle (deg)
const LEDGE = 13;                                       // counter ledge sticks out this far
const WZ = 14, WR = 14, AR = 17.5, WHEELS = [28, 184];  // wheel centre height, tyre radius, arch radius, wheel y
const FLOOR = Z0 + 3, YP = BY + 4, WT = 4;              // interior floor, partition wall, wall thickness
const SLOTS = [96, 120, 144];                           // food spots on the counter ledge
const COOK = 2.6;                                       // seconds per order

const CREAM = matOf('#fbf1d8'), TYRE = { l:'#4a4642', m:'#353230', d:'#222020' };
const GLASS = '#a9d2dc', RED = '#e2483d', GREEN = '#43c25c';
const SHELL = matOf('#f3cf6a'), TORT = matOf('#efd9a6'), LETTUCE = '#5cb848', TOMATO = '#e2483d', CHEESE = '#f6b52c', MEAT = '#8a4b2a';
const FOOD = { taco:{ label:'Taco', price:3 }, burrito:{ label:'Burrito', price:7 }, nachos:{ label:'Nachos', price:5 } };
const WALL = { l:'#e9eeee', m:'#d4dcdc', d:'#aeb8b8' };

/* ---------- helpers ---------- */
// rounded rectangle with a radius per corner [bottom-right, top-right, top-left, bottom-left] (u = y, v = z)
function corners(u0,v0,u1,v1,r){
  const c = (cu,cv,rr,a0,a1) => rr > 0 ? arcUV(cu,cv,rr,a0,a1,7) : [[cu,cv]];
  return [...c(u1-r[0],v0+r[0],r[0],-90,0), ...c(u1-r[1],v1-r[1],r[1],0,90), ...c(u0+r[2],v1-r[2],r[2],90,180), ...c(u0+r[3],v0+r[3],r[3],180,270)];
}
const notch = yc => arcUV(yc, WZ, AR, 173, 7, 14);       // wheel arch cut into the bottom edge
const BOX = corners(BY, Z0, D, ZT, [6, R, R, 0]);
const CAB = corners(0, Z0, BY+2, CABH, [0, 0, CR, 6]);   // overlaps the box by 2 (hidden seam when the cab is behind)
const CABF = corners(0, Z0, BY, CABH, [0, 0, CR, 6]);    // same, ending flush with the box (used when the cab is in front)
const BOX_FACE = [...BOX, ...notch(WHEELS[1])];          // BL corner ends at (BY,Z0), then the arch, then back to BR
const cabFace = prof => [...prof, ...notch(WHEELS[0])];
const HATCH = rrUV(HY0, HZ0, HY1, HZ1, 2.5);
const ACC = () => st.pal === 'tomato' ? '#3fa69a' : '#e2533d';     // accent paint (stripes, awning, logo)
// text lying on a face with outward normal n; reads left-to-right as seen from outside (along n × z)
const txn = (p, n, str, size, col, anchor='middle', weight=800, extra='letter-spacing=".04em"') => { const o = P(...p);
  return `<text transform="${txM(o, Dv(n[1], -n[0], 0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="${anchor}" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" ${extra}>${str}</text>`; };
// text on the serving (+x) side
const txa = (x,y,z,str,size,col,anchor='middle',weight=800) => txn([x,y,z], [1,0,0], str, size, col, anchor, weight);
// small sphere (screen circle) with a light offset and highlight
function ball(x,y,z,r,col,w=.9){
  const [X,Y] = P(x,y,z), rr = r*1.2247, m = matOf(col);
  return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(rr)}" fill="${m.m}"/><circle cx="${f(X-rr*.18)}" cy="${f(Y-rr*.2)}" r="${f(rr*.74)}" fill="${col}"/>`
    + `<circle cx="${f(X-rr*.38)}" cy="${f(Y-rr*.42)}" r="${f(rr*.22)}" fill="#fff" opacity=".7"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(rr)}" fill="none" stroke="${INK}" stroke-width="${w}"/>`;
}
// seeded pseudo-random
const rnd = i => { const s = Math.sin(i*127.1 + 311.7)*43758.5453; return s - Math.floor(s); };
const streaks = (a, b, w=1.6) => `<path d="${a}${b}" stroke="#fff" stroke-opacity=".5" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;

/* ---------- state ---------- */
const st = { pal:'mustard', hatch:0, hatchT:0, orders:[], next:1, time:0, frozen:false };
const lit = () => st.hatch === 1 && st.hatchT === 1;

/* ---------- wheels (side = +1: serving side x = W, -1: far side x = 0) ---------- */
function wheel(yc, side=1){
  const X = d => side > 0 ? W - d : d, rng = (a,b) => [Math.min(X(a),X(b)), Math.max(X(a),X(b))];
  const tyre = cylX(...rng(13, 2), yc, WZ, WR, TYRE, toneI, 1.3, 30);
  if (!facing([side,0,0])) return tyre;                                  // far side: only the tyre peeks out below
  let s = fill(pd(on(PX(X(0)), notch(yc))), '#2b2724');                 // dark wheel well
  s += tyre;
  s += ink(pd(on(PX(X(1.9)), ellUV(yc, WZ, WR-3.2, WR-3.2, 28))), .8);   // sidewall ring
  s += cylX(...rng(2, -.6), yc, WZ, 7.4, METAL, toneI, 1.1, 24);
  s += fill(pd(on(PX(X(-.7)), ellUV(yc, WZ, 3, 3, 16))), METAL.d) + ink(pd(on(PX(X(-.7)), ellUV(yc, WZ, 3, 3, 16))), .7);
  for (let k=0;k<5;k++){ const a = k/5*Math.PI*2 + .3; s += fill(pd(on(PX(X(-.7)), ellUV(yc+5*Math.cos(a), WZ+5*Math.sin(a), .8, .8, 8))), INK); }
  return s;
}

/* ---------- cab ---------- */
const mirror = side => { const x = side > 0 ? W : 0;
  return line([[x,9,74],[x+6*side,6,76]], 1.6) + (side > 0 ? box(W+4, 1, 70, W+8, 9, 82, DARK, toneI, 1) : box(-8, 1, 70, -4, 9, 82, DARK, toneI, 1)); };
const bumperF = () => box(3, -2.5, 17, W-3, 0, 26, METAL, tone, 1.2);      // front bumper (sits proud of the cab nose)

// the cab door side: wheel in its arch, stripe, door + window, handle, marker, mirror
function cabSide(side, m, prof){
  const x = side > 0 ? W : 0, n = [side,0,0], F = PX(x + .2*side), FACE = cabFace(prof);
  let s = wheel(WHEELS[0], side);
  s += fill(pd(on(PX(x), FACE)), tone(n,m));
  s += fill(pd(on(F, rectUV(0, 34, BY, 39))), tone(n,CREAM));            // stripe
  const door = [[16,33],[47,33],[47,90],[30,90],...arcUV(30,76,14,90,180,6).slice(1),[16,62]];
  s += ink(pd(on(F, door)), 1.2);
  const win = [[19,63],[44,63],[44,86],[31,86],...arcUV(31,75,11,90,180,6).slice(1),[19,66]];
  s += fill(pd(on(F, win)), GLASS) + ink(pd(on(F, win)), 1.1);
  const G = PX(x + .3*side);
  s += streaks(pd(on(G,[[23,66],[33,84]]),false), pd(on(G,[[29,66],[38,82]]),false));
  s += shape(on(F, rrUV(38,55,45,57.5,1)), METAL.m, .8);                    // handle
  s += shape(on(F, rrUV(3,42,8,46,1.5)), '#f2a33a', .8);                      // side marker
  s += ink(pd(on(PX(x), FACE)), 2.2);
  return s + mirror(side);
}

// the cab nose (y = 0): wrap-around stripe, grille, headlights, indicators, bumper + number plate, wipers
function cabFront(m){
  const n = [0,-1,0], F = PY(-.2), F2 = PY(-.4);
  let s = fill(pd(on(F, rectUV(0, 34, W, 39))), tone(n, CREAM));
  s += shape(on(F, rrUV(29, 28.5, 61, 50, 3)), DARK.m, 1.2);                 // grille
  let sl = ''; for (let z = 32; z <= 47; z += 3.6) sl += pd(on(F2, [[31.5,z],[58.5,z]]), false);
  s += `<path d="${sl}" fill="none" stroke="${DARK.l}" stroke-width="1.5" stroke-linecap="round"/>`;
  s += shape(on(PY(-.6), ellUV(45, 39.2, 4.2, 4.2, 18)), tone(n, CREAM), .9);  // badge: a tiny taco
  s += fill(pd(on(PY(-.7), arcUV(45, 40, 3, 180, 360, 10))), SHELL.l) + fill(pd(on(PY(-.7), rectUV(42.4, 39.8, 47.6, 40.9))), LETTUCE);
  for (const xc of [13, 77]){
    s += shape(on(F, ellUV(xc, 42, 7.4, 7.4, 22)), METAL.m, 1.2);             // headlight bezel + lens
    s += shape(on(F2, ellUV(xc, 42, 5.3, 5.3, 20)), lit() ? '#fff3b0' : '#f3f0e2', .9);
    s += fill(pd(on(PY(-.6), ellUV(xc-1.8, 43.8, 1.7, 1.2, 10))), '#ffffff', 'opacity=".85"');
    s += shape(on(F, rrUV(xc-4, 29.4, xc+4, 32.6, 1.2)), '#f2a33a', .8);       // indicator
  }
  s += shape(on(F, rrUV(41, 58, 49, 61, 1)), METAL.m, .8);                   // bonnet catch
  // wipers resting on the bottom of the windscreen
  const ws = (x,a) => [x, CR + (CR+.4)*Math.cos(a*Math.PI/180), CABH-CR + (CR+.4)*Math.sin(a*Math.PI/180)];
  for (const x of [24, 58]) s += line([ws(x,174), ws(x-7,166), ws(x-14,158)], 1.3) + fill(pd(on(PY(-.3), ellUV(x, 70.6, 1.2, 1.2, 8))), INK);
  return s;
}

function cab(m){
  const front = facing([0,-1,0]), prof = front ? CABF : CAB;
  let s = loft(on(PX(0),prof), on(PX(W),prof), n=>tone(n,m));
  // curved windscreen on the visible part of the big front-top corner
  const arc = arcUV(CR, CABH-CR, CR, 92, 178, 14);
  let gl = '';
  for (let i=0;i<arc.length-1;i++){
    const [a,b] = [arc[i], arc[i+1]];
    const nn = [0, ((a[0]+b[0])/2-CR), ((a[1]+b[1])/2-(CABH-CR))];
    if (!vis(nn)) continue;
    gl += face(pd([[6,a[0],a[1]],[W-6,a[0],a[1]],[W-6,b[0],b[1]],[6,b[0],b[1]]]), GLASS);
  }
  s += gl;
  const gEdge = arc.filter(p => vis([0,p[0]-CR,p[1]-(CABH-CR)]));
  if (gEdge.length > 1){
    s += ink(pd(gEdge.map(([u,v]) => [W-6,u,v]), false), 1) + ink(pd(gEdge.map(([u,v]) => [6,u,v]), false), 1);
    s += ink(pd([[6,...gEdge[0]],[W-6,...gEdge[0]]], false), 1);
    const gl1 = gEdge[gEdge.length-1];
    if (gl1 === arc[arc.length-1]) s += ink(pd([[6,...gl1],[W-6,...gl1]], false), 1);   // lower edge, seen from the front
    const g0 = gEdge[Math.floor(gEdge.length*.3)], g1 = gEdge[Math.floor(gEdge.length*.75)];
    s += streaks(pd([[30,...g0],[40,...g1]],false), pd([[48,...g0],[54,...g1]],false), 2);
  }
  if (facing([1,0,0])) s += cabSide(1, m, prof);
  if (facing([-1,0,0])) s += cabSide(-1, m, prof);
  if (front) s += cabFront(m);
  s += `<g clip-path="url(#noArch)">${hullInk([...on(PX(0),prof), ...on(PX(W),prof)], 2.8)}</g>`;
  if (front){   // bumper + number plate stand proud of the nose: after the silhouette
    s += bumperF() + shape(on(PY(-2.6), rrUV(34, 18.6, 56, 24.6, 1)), '#fbf6e6', .9);
    s += txn([45, -2.7, 20.3], [0,-1,0], 'TAC0 8', 4.2, INK, 'middle', 800, '');
  }
  return s;
}

/* ---------- interior, seen through the hatch (only from views where the hatch side faces) ---------- */
function interior(m){
  const v0 = facing([0,1,0]);                // view 0: looking toward +y (partition wall); else toward the back doors
  let s = '';
  // floor (checker)
  s += fill(pd([[WT,YP,FLOOR],[W,YP,FLOOR],[W,D,FLOOR],[WT,D,FLOOR]]), '#e9dfc5');
  let ch = '';
  for (let x = WT; x < W; x += 10) for (let y = YP; y < D; y += 10)
    if (((x-WT)/10 + (y-YP)/10) % 2 === 0) ch += pd([[x,y,FLOOR],[x+10,y,FLOOR],[x+10,y+10,FLOOR],[x,y+10,FLOOR]]);
  s += `<path d="${ch}" fill="#c9b994"/>`;
  // the far wall: partition behind the cab (view 0) or the inside of the back doors
  const YW = v0 ? YP : D - WT;
  s += fill(pd([[WT,YW,FLOOR],[W,YW,FLOOR],[W,YW,ZT],[WT,YW,ZT]]), WALL.m);
  let tl = '';
  for (let z = FLOOR+8; z < ZT; z += 8) tl += pd([[WT,YW,z],[W,YW,z]], false);
  for (let x = WT+8; x < W; x += 8) tl += pd([[x,YW,FLOOR],[x,YW,ZT]], false);
  s += `<path d="${tl}" fill="none" stroke="${WALL.d}" stroke-width=".5"/>`;
  s += ink(pd([[WT,YW,FLOOR],[W,YW,FLOOR]], false), .9);

  if (v0){
    // wall shelf with squeeze bottles (on the partition wall)
    s += box(46, YP, 44, 76, YP+9, 46, METAL, toneI, .9);
    [[72,'#e2483d'],[64,'#5cb848'],[56,'#f2c230'],[48,'#e98a2c']].forEach(([x,c]) => {
      const y = YP+4.5;
      s += cyl(x, y, 46, 55, 2.6, matOf(c), toneI, 1, 16) + cyl(x, y, 55, 58, 1.1, matOf('#f4f1e6'), toneI, .7, 10);
    });
  } else {
    // against the back doors: a tall fridge and a drinks crate on the floor
    const y1 = D - WT, y0 = y1 - 22;
    s += box(14, y0, FLOOR, 44, y1, 96, METAL, toneI, 1.1);
    s += ink(pd(on(PY(y0-.1), [[15,62],[43,62]]), false), .9);
    s += shape(on(PY(y0-.2), rrUV(37, 66, 40, 80, 1)), METAL.d, .7) + shape(on(PY(y0-.2), rrUV(37, 46, 40, 58, 1)), METAL.d, .7);
    s += shape(on(PY(y0-.2), rrUV(18, 84, 30, 91, 1)), '#ffffff', .6);
    s += box(48, y1-14, FLOOR, 66, y1, 30, matOf('#d94a3a'), toneI, 1);
    for (const x of [51, 56, 61]) s += cyl(x+1.5, y1-7, 30, 37, 1.8, matOf(x === 56 ? '#5cb848' : '#f2c230'), toneI, .8, 12);
  }

  const cooking = st.orders.find(o => o.state === 'cooking'), hot = st.orders.some(o => o.state === 'cooking');
  // griddle station
  const G = [48, 82, 74, 114];   // x0,y0,x1,y1
  let gr = box(G[0], G[1], FLOOR, G[2], G[3], 46, METAL, toneI, 1.1);
  gr += box(G[0], G[1], 46, G[2], G[3], 48, METAL, toneI, .9);
  const plate = [[G[0]+2,G[1]+2,48.1],[G[2]-2,G[1]+2,48.1],[G[2]-2,G[3]-2,48.1],[G[0]+2,G[3]-2,48.1]];
  gr += fill(pd(plate), hot ? '#3d3330' : '#4a4642') + ink(pd(plate), .8);
  for (const y of [88, 97, 106]) gr += shape(on(PX(G[2]+.1), ellUV(y, 41.5, 1.6, 1.6, 10)), INK, 0) + fill(pd(on(PX(G[2]+.2), ellUV(y, 41.5, 1, 1, 8))), hot ? '#ff7a3a' : METAL.d);
  if (cooking) gr += griddleFood(cooking, (G[0]+G[2])/2, (G[1]+G[3])/2);

  // the cook: body block, apron, arm with a spatula, round head, cap
  const cx0 = 56, cx1 = 66, cy0 = 117, cy1 = 129;
  const sw = cooking ? Math.sin(st.time*9)*2 : 0;
  let arm = line([[61, cy0+1, 44],[64, cy0-6+sw*.4, 48.5]], 3.4) + `<path d="${pd([[61,cy0+1,44],[64,cy0-6+sw*.4,48.5]],false)}" stroke="#e9b48a" stroke-width="2" stroke-linecap="round" fill="none"/>`;
  arm += shape([[63,cy0-6+sw*.4,48.6],[68,cy0-9+sw,48.6],[68,cy0-14+sw,48.6],[63,cy0-11+sw*.4,48.6]], METAL.l, .8);
  let ck = box(cx0, cy0, FLOOR, cx1, cy1, 50, matOf('#3f7fc8'), toneI, 1.1);
  ck += shape(on(PX(cx1+.1), rrUV(cy0+2, 24, cy1-2, 47, 2)), '#fbfaf3', .9);
  ck += ball(61, 123, 57.5, 6.4, '#eab58b', 1.1);
  const [hx, hy] = P(61, 123, 57.5);
  // cap: dome over the top half + a brim pointing to the window
  const cr = 6.4*1.2247;
  ck += `<path d="M${f(hx-cr*1.02)} ${f(hy-cr*.15)} A${f(cr*1.02)} ${f(cr*1.02)} 0 0 1 ${f(hx+cr*1.02)} ${f(hy-cr*.15)} Z" fill="${RED}" stroke="${INK}" stroke-width="1"/>`;
  ck += shape(on(PZ(61.6), [[64,117.5],[68.5,118.5],[69.5,123],[68.5,127.5],[64,128.5]]), mix(RED,'#000000',.15), .9);
  for (const dy of [-2.4, 2.4]) ck += fill(pd(on(PX(67.2), ellUV(123+dy, 55.4, .8, .9, 8))), INK);
  ck += ink(pd(on(PX(67.3), arcUV(123, 54.2, 1.8, 200, 340, 6)), false), .8);
  ck += fill(pd(on(PX(67.2), ellUV(118.6, 54.6, 1.1, .8, 8))), '#f08f86', 'opacity=".7"') + fill(pd(on(PX(67.2), ellUV(127.4, 54.6, 1.1, .8, 8))), '#f08f86', 'opacity=".7"');

  // view 0: griddle, then the cook (arm first); otherwise the cook is behind the griddle and the arm reaches over it
  s += v0 ? gr + arm + ck : ck + gr + arm;

  // inner counter (pass-through shelf) + cash register
  s += box(74, HY0-4, 46, W-WT, HY1+8, 52, METAL, toneI, 1);
  s += register(m);

  // ticket rail just inside the top of the hatch
  const tickets = st.orders.filter(o => o.state !== 'ready');
  tickets.forEach((o,i) => {
    const y = 90 + i*14, X = PX(W-5.3);
    s += shape(on(X, [[y-5,89],[y+5,89],[y+5,79],[y+3.5,78],[y+2,79],[y,78],[y-2,79],[y-3.5,78],[y-5,79]]), o.state === 'cooking' ? '#fffbe8' : '#ffffff', .8);
    s += txa(W-5.2, y, 84.4, '#'+o.n, 3.2, RED) + txa(W-5.2, y, 80.6, o.item.toUpperCase().slice(0,4), 2.3, INK);
  });
  s += line([[W-5,84,89.4],[W-5,134,89.4]], 2.4) + `<path d="${pd([[W-5,84,89.4],[W-5,134,89.4]],false)}" stroke="${METAL.l}" stroke-width="1" fill="none"/>`;

  // steam
  if (cooking){
    let sm = '';
    for (let k=0;k<6;k++){
      const ph = (st.time*.55 + k/6) % 1, y = 88 + rnd(k)*22 + Math.sin(ph*6+k)*2, x = 54 + rnd(k+9)*16;
      const [X,Y] = P(x, y, 50 + ph*30), r = (2.4 + ph*5.5)*1.2;
      sm += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(r)}" fill="#ffffff" fill-opacity=".8" stroke="#9aa6a8" stroke-width=".7" opacity="${f(.9*Math.sin(ph*Math.PI))}"/>`;
    }
    s += `<g pointer-events="none">${sm}</g>`;
  }
  // light: dim when the lights are off, warm glow when on
  const area = pd(on(PX(W), HATCH));
  s += lit() ? fill(area, '#fff1b8', 'opacity=".14" pointer-events="none"') : fill(area, '#20203a', 'opacity=".42" pointer-events="none"');
  return s;
}

// food sizzling on the griddle (progress o.t)
function griddleFood(o, x, y){
  const t = o.t, z = 48.3;
  let s = '';
  if (o.item === 'nachos'){
    for (let k=0;k<7;k++){ const a = rnd(k+3)*6.28, px = x-6+rnd(k+1)*12, py = y-7+rnd(k+2)*14;
      s += shape([[px+3*Math.cos(a),py+3*Math.sin(a),z],[px+3*Math.cos(a+2.1),py+3*Math.sin(a+2.1),z],[px+3*Math.cos(a+4.2),py+3*Math.sin(a+4.2),z]], mix('#f2c14e','#c98a2a',t*.5), .6); }
    if (t > .4) s += fill(pd(on(PZ(z+.1), ellUV(x, y, 6*Math.min(1,(t-.4)*2.5), 4.5*Math.min(1,(t-.4)*2.5), 16))), CHEESE, 'opacity=".9"');
  } else {
    const tort = on(PZ(z), ellUV(x, y, 9, 9, 24));
    s += fill(pd(tort), mix(TORT.l, '#d9a85a', t*.6)) + ink(pd(tort), .8);
    for (let k=0;k<9;k++) if (t > k/12) s += fill(pd(on(PZ(z+.1), ellUV(x-5+rnd(k+20)*10, y-5+rnd(k+30)*10, 1.4, 1.4, 8))), MEAT);
  }
  // bubbles popping
  for (let k=0;k<8;k++){
    const ph = (st.time*1.7 + rnd(k+50)) % 1, r = .4 + ph*1.1;
    const b = on(PZ(z+.2), ellUV(x-10+rnd(k+60)*20, y-12+rnd(k+70)*24, r, r, 10));
    s += `<path d="${pd(b)}" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-opacity="${f(.85*(1-ph))}" stroke-width=".5"/>`;
  }
  return s;
}

/* ---------- food served on the counter ledge ---------- */
function served(o){
  const y = SLOTS[o.slot], x0 = W+2, x1 = W+11, z = HZ0;
  let s = '';
  if (o.item === 'nachos'){
    s += box(x0, y-7.5, z, x1, y+7.5, z+2.4, matOf('#2f2b28'), toneI, 1);
    s += shape([[x0+1,y-6.5,z+2.5],[x1-1,y-6.5,z+2.5],[x1-1,y+6.5,z+2.5],[x0+1,y+6.5,z+2.5]], '#47423d', 0);
    const chips = [[3,-4,.3],[6,-1,2.2],[4,3,4.1],[7,4,1.1],[2.5,0,5.2],[6.5,-5,3.3],[5,1,.8]];
    for (const [dx,dy,a] of chips){ const cx = x0+dx, cy = y+dy, zz = z+2.7+(dx%2);
      s += shape([[cx+3*Math.cos(a),cy+3*Math.sin(a),zz],[cx+3*Math.cos(a+2.1),cy+3*Math.sin(a+2.1),zz+1.4],[cx+3*Math.cos(a+4.2),cy+3*Math.sin(a+4.2),zz]], '#f2c14e', .7); }
    s += fill(pd(on(PZ(z+4.6), [[x0+4,y-3],[x0+6.5,y-4],[x0+7,y-.5],[x0+6,y+3],[x0+3.5,y+2.5],[x0+3,y]])), CHEESE) + ink(pd(on(PZ(z+4.6), [[x0+4,y-3],[x0+6.5,y-4],[x0+7,y-.5],[x0+6,y+3],[x0+3.5,y+2.5],[x0+3,y]])), .6);
    s += fill(pd(on(PZ(z+4.7), ellUV(x0+5, y+1, .9, .9, 8))), '#4c8a3a') + fill(pd(on(PZ(z+4.7), ellUV(x0+4.4, y-2, .9, .9, 8))), TOMATO);
    return s;
  }
  // paper boat
  s += box(x0, y-7, z, x1, y+7, z+3, CREAM, toneI, 1);
  s += shape([[x0+1,y-6,z+3.05],[x1-1,y-6,z+3.05],[x1-1,y+6,z+3.05],[x0+1,y+6,z+3.05]], '#e6dcc2', 0);
  s += fill(pd(on(PX(x1+.1), rectUV(y-7, z+1, y+7, z+1.8))), RED);
  if (o.item === 'taco'){
    const xa = x0+3, xb = x1-2.5, cz = z+10, r = 6.4;
    const half = [...arcUV(y, cz, r, 180, 360, 14)];
    s += loft(on(PX(xa), half), on(PX(xb), half), n => n[2] > .9 ? MEAT : toneI(n, SHELL));
    s += fill(pd(on(PZ(cz+.05), rectUV(xa, y-r+.8, xb, y+r-.8))), MEAT);
    for (let k=0;k<6;k++) s += fill(pd(on(PX(xb-.6-rnd(k)*2), ellUV(y-5+k*2, cz+.6+rnd(k+4)*.8, 1.5, 1.3, 10))), k%3===1 ? TOMATO : LETTUCE);
    s += fill(pd(on(PZ(cz+1.2), ellUV(xa+2, y+1, 1.2, 3, 10))), CHEESE);
    s += fill(pd(on(PX(xb), half)), toneI([1,0,0], SHELL)) + ink(pd(on(PX(xb), half)), 1);
    for (let k=0;k<4;k++) s += fill(pd(on(PX(xb+.05), ellUV(y-3+k*2.2, cz-2-rnd(k+7)*3, .5, .5, 6))), '#c99a3c');
    s += hullInk([...on(PX(xa), half), ...on(PX(xb), half)], 1.1);
  } else {
    const cx = (x0+x1)/2, cz = z+3+3.6, r = 3.8, ya = y-6.5, yb = y+6.5, ym = y;
    const A = on(PY(ya), ellUV(cx, cz, r, r, 18)), M = on(PY(ym), ellUV(cx, cz, r, r, 18)), B = on(PY(yb), ellUV(cx, cz, r, r, 18));
    s += loft(A, M, n => toneI(n, METAL)) + loft(M, B, n => toneI(n, TORT));
    if (facing([0,1,0])){          // open tortilla end with the spiral
      s += fill(pd(B), toneI([0,1,0], TORT)) + ink(pd(B), .9);
      s += ink(pd(on(PY(yb+.05), arcUV(cx, cz, 2.2, 0, 300, 10)), false), .6) + ink(pd(on(PY(yb+.05), arcUV(cx+.3, cz, 1, 60, 330, 8)), false), .5);
    } else {                       // foil-wrapped end
      s += fill(pd(A), toneI([0,-1,0], METAL)) + ink(pd(A), .9);
      for (const a of [20, 95, 170, 250, 320]) s += line([[cx+1.2*Math.cos(a*Math.PI/180), ya-.05, cz+1.2*Math.sin(a*Math.PI/180)],[cx+3.2*Math.cos((a+12)*Math.PI/180), ya-.05, cz+3.2*Math.sin((a+12)*Math.PI/180)]], .4);
    }
    s += ink(sp(hull([...M].map(p => P(...p)))).replace(/Z$/,''), .5);
    s += line([[cx+r, ym, cz],[cx, ym, cz+r]], .8);
    for (const k of [0,1,2]) s += line([[cx+r*.8, ya+1.5+k*1.6, cz+1.5],[cx+r*.3, ya+2.5+k*1.6, cz+r*.9]], .4);
    s += hullInk([...A, ...B], 1.1);
  }
  return s;
}

// counter ledge with brackets, food waiting on it

  for (const y of [HY0+6, HY1-6]) s += shape([[W,y,HZ0-4],[W+LEDGE-3,y,HZ0-4],[W,y,HZ0-15]], METAL.m, 1);

  return s;

/* ---------- awning: hinged at the top, lifts up into a shade ---------- */
function awning(m){
  const p = ease(st.hatch), th = AOPEN * p * Math.PI/180;
  const y0 = HY0-4, y1 = HY1+4, len = ALEN, t = 2.4, hx = W+.6, hz = HINGE;
  const dn = [Math.sin(th), 0, -Math.cos(th)], out = [Math.cos(th), 0, Math.sin(th)];
  const Q = (sA, w, y) => [hx + sA*dn[0] + w*out[0], y, hz + sA*dn[2] + w*out[2]];
  const accent = ACC();
  const topSide = vis(out);                       // outer (painted) face seen, else the underside
  const n = topSide ? out : out.map(v=>-v), w = topSide ? t : 0, sg = topSide ? 1 : -1;
  let s = '', struts = '';
  if (p > .04) for (const y of [y0+5, y1-5]) struts += line([[W, y, HZ1-4], Q(len*.55, 0, y)], 2.2) + `<path d="${pd([[W,y,HZ1-4], Q(len*.55,0,y)],false)}" stroke="${METAL.l}" stroke-width=".9" fill="none"/>`;
  if (topSide) s += struts;
  const faces = [
    { n: dn,             p: [Q(len,0,y0),Q(len,0,y1),Q(len,t,y1),Q(len,t,y0)] },
    { n: dn.map(v=>-v),  p: [Q(0,0,y0),Q(0,0,y1),Q(0,t,y1),Q(0,t,y0)] },
    { n: [0,1,0],        p: [Q(0,0,y1),Q(len,0,y1),Q(len,t,y1),Q(0,t,y1)] },
    { n: [0,-1,0],       p: [Q(0,0,y0),Q(len,0,y0),Q(len,t,y0),Q(0,t,y0)] },
  ];
  for (const fc of faces) if (vis(fc.n)) s += shape(fc.p, tone(fc.n, CREAM), 1);
  // striped canvas on the visible big face
  const N = 9, sw = (y1-y0)/N;
  for (let i=0;i<N;i++){
    const ya = y0+i*sw, yb = ya+sw, col = i%2 ? CREAM : matOf(accent);
    s += face(pd([Q(0,w,ya),Q(0,w,yb),Q(len,w,yb),Q(len,w,ya)]), topSide ? tone(n, col) : toneI([0,0,1], col));
  }
  s += ink(pd([Q(0,w,y0),Q(0,w,y1),Q(len,w,y1),Q(len,w,y0)]), 1.6);
  s += ink(pd([Q(len-7,w,y0),Q(len-7,w,y1)], false), .9);
  if (!topSide) s += struts;
  // marquee bulbs along the free edge
  const on_ = lit();
  let bl = '';
  for (let y = y0+5; y <= y1-4; y += 9.4){
    const c = Q(len-3.5, w+sg*1.6, y), [X,Y] = P(...c);
    if (on_) bl += `<circle cx="${f(X)}" cy="${f(Y)}" r="4.6" fill="#ffe7a0" opacity=".45"/>`;
    bl += ball(...c, 1.5, on_ ? '#ffd84a' : '#ece6d4', .8);
  }
  s += `<g pointer-events="none">${bl}</g>`;
  s += ink(pd([[hx,y0-1,hz],[hx,y1+1,hz]],false), 1.8);   // hinge
  return act('awning', s);
}

/* ---------- OPEN / CLOSED plaque: flips with the hatch ---------- */
function plaque(){
  const k = Math.cos(Math.PI*st.hatch), sc = Math.max(.08, Math.abs(k)), open = st.hatch > .5;
  const yc = 62, zc = 80, hw = 8, hh = 6*sc, X = PX(W+.6);
  let s = line([[W+.4,yc,90],[W+.6,yc-hw+2,zc+hh]], .7) + line([[W+.4,yc,90],[W+.6,yc+hw-2,zc+hh]], .7);
  s += fill(pd(on(PX(W+.2), ellUV(yc, 90, .8, .8, 8))), INK);
  s += shape(on(X, rrUV(yc-hw, zc-hh, yc+hw, zc+hh, 1.5*sc)), open ? GREEN : RED, 1.1);
  if (sc > .5) s += `<g transform="translate(0 0)">${txa(W+.7, yc, zc-1.6*sc, open ? 'OPEN' : 'CLOSED', open ? 4.4 : 3.2, '#ffffff')}</g>`;
  return act('awning', s);
}

/* ---------- roof: sign + vents ---------- */
function roof(m){
  const sx = facing([1,0,0]) ? 1 : -1;            // which long side of the sign / taco faces the viewer
  // mushroom vent over the front
  const vent1 = cyl(26, 70, ZT, ZT+4, 4, METAL, toneI, 1, 18) + cyl(26, 70, ZT+4, ZT+6.5, 7, METAL, toneI, 1, 20);
  // sign board on two posts + a big taco on top
  let sg = byDepth([112, 168].map(y => ({ at:[46,y,ZT], svg: box(44, y-2, ZT, 48, y+2, 118, METAL, toneI, 1) })));
  sg += box(43, 104, 118, 49, 176, 130, CREAM, toneI, 1.2);
  sg += sx > 0 ? txa(49.2, 140, 120.8, 'TACOS', 10.5, RED, 'middle', 900) : txn([42.8, 140, 120.8], [-1,0,0], 'TACOS', 10.5, RED, 'middle', 900);
  const yc = 140, zc = 151, r = 21, xa = 38, xb = 52, xf = sx > 0 ? xb : xa;

  sg += loft(on(PX(xa), half), on(PX(xb), half), n => n[2] > .9 ? MEAT : tone(n, SHELL));
  // filling on top: lettuce, tomato, cheese
  let fl = '';
  for (let k=0;k<11;k++){ const y = yc-r+3+k*3.6, x = xa+2+rnd(k)*(xb-xa-4);
    fl += fill(pd(on(PZ(zc+.4), ellUV(x, y, 2.6, 2.2, 10))), k%4===2 ? CHEESE : LETTUCE); }
  sg += fl;
  let lf = '';
  for (let k=0;k<12;k++){ const y = yc-r+2+k*3.5, P_ = PX(xf - .8*sx); lf += fill(pd(on(P_, ellUV(y, zc+.8+rnd(k+3)*1.2, 2.3, 2, 10))), k%3===1 ? TOMATO : LETTUCE) + ink(pd(on(P_, arcUV(y, zc+.8+rnd(k+3)*1.2, 2.3, 10, 170, 5)), false), .6); }
  sg += lf;
  sg += fill(pd(on(PX(xf), half)), tone([sx,0,0], SHELL)) + ink(pd(on(PX(xf), half)), 1.3);
  for (let k=0;k<9;k++) sg += fill(pd(on(PX(xf+.1*sx), ellUV(yc-14+rnd(k+40)*28, zc-3-rnd(k+41)*14*(1-Math.abs(rnd(k+40)-.5)), .9, .7, 8))), '#cf9a3a');
  sg += hullInk([...on(PX(xa), half), ...on(PX(xb), half)], 1.6);
  // box vent near the back, louvres on its long side
  let vent2 = box(22, 190, ZT, 52, 208, ZT+5, METAL, tone, 1.1);
  for (const y of [194, 198, 202]) vent2 += line([[sx > 0 ? 52.1 : 21.9, y, ZT+1],[sx > 0 ? 52.1 : 21.9, y, ZT+4]], .8);
  return byDepth([{ at:[26,70,ZT], svg:vent1 }, { at:[45,140,ZT], svg:sg }, { at:[37,199,ZT], svg:vent2 }]);
}

/* ---------- back of the truck (+y) ---------- */
const bumperR = () => box(8, D, 12, 82, D+5, 18, METAL, tone, 1.1);    // step bumper
function back(m){
  const Y = PY(D+.2);
  let s = '';
  s += ink(pd(on(Y, rectUV(16, 24, 74, 104))), 1.2) + ink(pd(on(Y, [[45,24],[45,104]]), false), 1.1);
  for (const [a,b] of [[20,41],[49,70]]) s += fill(pd(on(Y, rrUV(a, 80, b, 98, 2))), GLASS) + ink(pd(on(Y, rrUV(a, 80, b, 98, 2))), 1);
  s += shape(on(Y, rrUV(40, 56, 43.5, 64, 1)), METAL.m, .7) + shape(on(Y, rrUV(46.5, 56, 50, 64, 1)), METAL.m, .7);
  for (const xa of [4, 77]){
    s += shape(on(Y, rrUV(xa, 26, xa+9, 46, 2)), RED, 1);
    s += fill(pd(on(PY(D+.3), rrUV(xa+1.5, 38, xa+7.5, 44, 1.5))), '#ff9a8a', 'opacity=".8"');
    s += shape(on(Y, rrUV(xa, 48, xa+9, 53, 1.5)), '#f2a33a', .8);
  }
  s += shape(on(Y, rrUV(35, 28, 55, 37, 1)), '#fbf6e6', .9);
  s += txn([45, D+.3, 30.6], [0,1,0], 'TAC0 8', 4.2, INK, 'middle', 800, '');
  s += bumperR();
  return s;
}

/* ---------- the serving side (+x): rear wheel, hatch + interior, face, plaque, menu, ledge ---------- */
function hatchSide(m){
  let s = wheel(WHEELS[1], 1);
  s += clipTo(on(PX(W), HATCH), interior(m));
  // reveal of the opening: the side jamb that faces the viewer, then the sill
  s += facing([0,1,0]) ? face(pd([[W-WT,HY0,HZ0],[W,HY0,HZ0],[W,HY0,HZ1],[W-WT,HY0,HZ1]]), tone([0,1,0],m))
                       : face(pd([[W-WT,HY1,HZ0],[W,HY1,HZ0],[W,HY1,HZ1],[W-WT,HY1,HZ1]]), tone([0,-1,0],m));
  s += face(pd([[W-WT,HY0,HZ0],[W,HY0,HZ0],[W,HY1,HZ0],[W-WT,HY1,HZ0]]), METAL.l);
  const X = PX(W);
  s += `<path d="${pd(on(X, BOX_FACE))}${pd(on(X, HATCH))}" fill="${tone([1,0,0],m)}" fill-rule="evenodd"/>`;
  s += ink(pd(on(X, HATCH)), 1.8);
  const F = PX(W+.2);
  s += fill(pd(on(F, rectUV(BY, 34, D-2, 39))), tone([1,0,0],CREAM));
  s += fill(pd(on(F, rectUV(BY, 30.5, D-2, 32))), tone([1,0,0], matOf(ACC())));
  s += ink(pd(on(X, BOX_FACE)), 2.2);
  s += ink(pd([[W,BY,ZT-R],[W,BY,CABH]], false), 1.4);
  s += plaque();
  s += menu();
  s += ledge();
  return s;
}

/* ---------- the far side (−x): plain panel with the painted logo ---------- */
function farSide(m){
  const n = [-1,0,0], X = PX(0), F = PX(-.2), F2 = PX(-.4), acc = ACC();
  let s = wheel(WHEELS[1], -1);
  s += fill(pd(on(X, BOX_FACE)), tone(n,m));
  s += fill(pd(on(F, rectUV(BY, 34, D-2, 39))), tone(n,CREAM));
  s += fill(pd(on(F, rectUV(BY, 30.5, D-2, 32))), tone(n, matOf(acc)));
  // big painted TACOS logo with a drop shadow + tagline
  s += txn([-.3, 119, 56.8], n, 'TACOS', 34, mix(m.d, '#000000', .1), 'middle', 900);
  s += txn([-.4, 117.6, 58.2], n, 'TACOS', 34, acc, 'middle', 900, `letter-spacing=".04em" stroke="${CREAM.l}" stroke-width="1.2" paint-order="stroke"`);
  s += txn([-.4, 118, 47.5], n, '· FRESH OFF THE GRIDDLE ·', 5.2, tone(n,m) === m.l ? mix(m.l, '#000000', .55) : mix(tone(n,m), '#ffffff', .55), 'middle', 800);
  // painted emblem: a taco in a sun
  const ec = [193, 74];
  s += shape(on(F, ellUV(...ec, 15, 15, 32)), tone(n, CREAM), 1.2);
  s += fill(pd(on(F2, ellUV(...ec, 12.2, 12.2, 32))), acc);
  const sh = arcUV(ec[0], ec[1]+1.5, 9, 180, 360, 16);
  for (let k=0;k<9;k++) s += fill(pd(on(PX(-.5), ellUV(ec[0]-7.2+k*1.8, ec[1]+2.2+rnd(k)*1.2, 1.7, 1.5, 8))), k%3===1 ? TOMATO : LETTUCE);
  s += shape(on(PX(-.6), sh), SHELL.l, 1);
  for (let k=0;k<5;k++) s += fill(pd(on(PX(-.7), ellUV(ec[0]-5+rnd(k+40)*10, ec[1]-1-rnd(k+41)*5, .7, .6, 6))), '#cf9a3a');
  // generator louvre, fuel filler, marker lights
  s += shape(on(F, rrUV(183, 93, 205, 104, 1.5)), tone(n, METAL), 1);
  let lv = ''; for (let z = 95.5; z < 103; z += 2.4) lv += pd(on(F2, [[185.5,z],[202.5,z]]), false);
  s += ink(lv, .8);
  s += shape(on(F, ellUV(150, 25, 3.4, 3.4, 16)), METAL.m, 1) + ink(pd(on(F2, [[148,25],[152,25]]), false), .7);
  for (const y of [56, 212]) s += shape(on(F, rrUV(y-2.5, 42, y+2.5, 46, 1.5)), '#f2a33a', .8);
  s += ink(pd(on(X, BOX_FACE)), 2.2);
  s += ink(pd([[0,BY,ZT-R],[0,BY,CABH]], false), 1.4);
  return s;
}

/* ---------- the strip of the box above the cab (−y): clearance lights ---------- */
function boxFront(){
  let s = '';
  for (const x of [18, 45, 72]) s += shape(on(PY(BY-.2), rrUV(x-3.5, 97.5, x+3.5, 100.5, 1.2)), '#f2a33a', .8);
  return s;
}

/* ---------- scene ---------- */
function scene(st, m){
  let s = '';
  const fX = facing([1,0,0]), fY = facing([0,1,0]), fF = facing([0,-1,0]);
  // shadow
  const sh = [];
  for (const x of [0, W]) { for (const [y,z] of BOX) sh.push([x,y,z]); for (const [y,z] of CAB) sh.push([x,y,z]); }
  for (const [y,z] of [[104,118],[176,118],[119,151],[161,151],[140,130]]) sh.push([45,y,z]);
  const th = AOPEN*ease(st.hatch)*Math.PI/180;
  for (const y of [HY0-4, HY1+4]) sh.push([W+.6+ALEN*Math.sin(th), y, HINGE-ALEN*Math.cos(th)]);
  s += castShadow(sh);

  // silhouette clip that leaves the wheel arches open (on whichever long side faces the viewer)
  const AX = fX ? W : 0;
  let holes = '';
  for (const yc of WHEELS) holes += pd(on(PX(AX), [...arcUV(yc, WZ, AR+1.6, 180, 0, 14), [yc+AR+1.6, -10], [yc-AR-1.6, -10]]));
  s += `<clipPath id="noArch"><path clip-rule="evenodd" d="M-2000 -2000H4000V4000H-2000Z${holes}"/></clipPath>`;

  // parts on faces turned away: drawn first so the body hides them (whatever sticks out past it still shows)
  const behind = [];
  if (!fX){
    for (const yc of WHEELS) behind.push({ at:[W-7, yc, WZ], svg: wheel(yc, 1) });
    behind.push({ at:[W+6, 5, 76], svg: mirror(1) }, { at:[W+6, (HY0+HY1)/2, HZ0], svg: ledge() }, { at:[W+10, (HY0+HY1)/2, HINGE], svg: awning(m) });
  } else {
    for (const yc of WHEELS) behind.push({ at:[7, yc, WZ], svg: wheel(yc, -1) });
    behind.push({ at:[-6, 5, 76], svg: mirror(-1) });
  }
  if (!fY) behind.push({ at:[45, D+2, 15], svg: bumperR() });
  if (!fF) behind.push({ at:[45, -1, 21], svg: bumperF() });
  s += byDepth(behind);

  // box body: the serving side or the far side, the shell, the back, the strip above the cab, silhouette
  let bod = fX ? hatchSide(m) : farSide(m);
  bod += loft(on(PX(0),BOX), on(PX(W),BOX), n=>tone(n,m));
  if (fY) bod += back(m);
  if (fF) bod += boxFront();
  bod += `<g clip-path="url(#noArch)">${hullInk([...on(PX(0),BOX), ...on(PX(W),BOX), ...(fY ? [[8,D+5,12],[82,D+5,12],[8,D+5,18]] : [])], 2.8)}</g>`;

  // the cab is behind the box unless its nose faces the viewer
  s += fF ? bod + cab(m) : cab(m) + bod;
  s += roof(m);
  if (fX) s += awning(m);
  return s;
}

/* ---------- behaviour ---------- */
let ui, running = false;
const freeSlot = () => [0,1,2].find(i => !st.orders.some(o => o.state === 'ready' && o.slot === i));
function step(dt){
  st.time += dt;
  let more = false;
  if (st.hatch !== st.hatchT){
    const sg = Math.sign(st.hatchT - st.hatch); st.hatch += sg*dt/1.1;
    if ((st.hatchT - st.hatch)*sg <= 0) st.hatch = st.hatchT;
    more = true;
  }
  const cur = st.orders.find(o => o.state !== 'ready');
  if (cur && lit()){
    cur.state = 'cooking'; cur.t += dt/COOK; more = true;
    if (cur.t >= 1){ cur.t = 1; cur.state = 'ready'; cur.slot = freeSlot(); ui.flash(`Order #${cur.n} is up · ${FOOD[cur.item].label.toLowerCase()} on the counter`, 1600); }
  }
  return more;
}
const kick = () => { if (running || st.frozen) return; running = true; ui.animate(dt => { const more = step(dt); if (!more) running = false; return more; }); };

function toggleHatch(){
  if (st.frozen) st.frozen = false;
  if (st.hatchT === 1){
    if (st.orders.some(o => o.state !== 'ready')) return ui.flash('Still cooking · wait for the orders');
    if (st.orders.length) return ui.flash('Hand out the food on the counter first');
  }
  st.hatchT = st.hatchT ? 0 : 1; kick();
}
function order(item){
  if (!lit()) return ui.flash(st.hatchT ? 'Opening up · one moment' : "We're closed · click the awning to open up");
  if (st.orders.length >= 3) return ui.flash('Queue is full · 3 orders max');
  st.frozen = false;
  st.orders.push({ n: st.next++, item, t: 0, state: 'queued' });
  kick();
}
function take(n){
  const i = st.orders.findIndex(o => o.n === n && o.state === 'ready');
  if (i < 0) return;
  st.orders.splice(i, 1);
  ui.flash(`Order #${n} · enjoy!`, 1800);
}

ui = mountFigure({
  fig:'16', title:'Food truck', hint:'lift the awning, order from the menu board, grab your food',
  idea:"A whole little kitchen fits in a van because everything is in one line: grill, counter, window.",
  size:[W+30, D+5, 158], palette:'mustard', state:st, views:true,
  scene: (st, m) => scene(st, m),
  readout: st => {
    if (st.hatch !== st.hatchT) return st.hatchT ? 'Opening up…' : 'Closing up…';
    if (st.hatch === 0) return 'Closed · click the awning to open the hatch';
    const c = st.orders.find(o => o.state === 'cooking'), q = st.orders.filter(o => o.state === 'queued').length;
    const r = st.orders.filter(o => o.state === 'ready');
    if (c) return `Cooking order #${c.n} · ${FOOD[c.item].label.toLowerCase()} ${Math.round(c.t*100)}%` + (q ? ` · ${q} waiting` : '') + (r.length ? ` · #${r[0].n} ready` : '');
    if (r.length) return `Order #${r[0].n} ready · click the ${FOOD[r[0].item].label.toLowerCase()} on the counter`;
    return '● Open · pick a dish from the menu board';
  },
  buttonsLabel:'Truck',
  buttons:[
    { label:'Open the hatch', onClick: () => st.hatchT ? ui.flash("We're open · place an order") : toggleHatch() },
    { label:'Order food', choices: () => [['taco','Taco $3'],['burrito','Burrito $7'],['nachos','Nachos $5']].map(([k,l]) => ({ label:l, disabled: !lit() || st.orders.length >= 3, onClick: () => order(k) })) },
    { label:'Take your food', onClick: () => { const o = st.orders.find(o => o.state === 'ready'); o ? take(o.n) : ui.flash(st.orders.length ? 'Still cooking…' : 'Order something first'); } },
    { label:'Close the hatch', onClick: () => st.hatchT ? toggleHatch() : ui.flash('Already closed') },
  ],
  next: st => st.hatch !== st.hatchT ? -1 : !st.hatchT ? 0 : st.orders.some(o => o.state === 'ready') ? 2 : st.orders.length ? -1 : 1,
  acts:{ awning: toggleHatch, order: (st, a) => order(a.dataset.item), take: (st, a) => take(+a.dataset.n) },
  params:(st, q) => {
    const items = k => (q.get(k) || '').split(',').filter(v => FOOD[v]);
    const ready = items('ready'), cooking = items('order');
    if (q.get('open') === '1' || ready.length || cooking.length) st.hatch = st.hatchT = 1;
    ready.slice(0,3).forEach((item, i) => st.orders.push({ n: st.next++, item, t: 1, state: 'ready', slot: i }));
    cooking.slice(0, 3 - st.orders.length).forEach(item => st.orders.push({ n: st.next++, item, t: 0, state: 'queued' }));
    if (q.has('hatch') && !st.orders.length) st.hatch = st.hatchT = Math.min(1, Math.max(0, +q.get('hatch')));
    const first = st.orders.find(o => o.state === 'queued');
    if (first && q.has('t')){ first.state = 'cooking'; first.t = Math.min(.99, Math.max(0, +q.get('t'))); st.frozen = true; st.time = 1.3; }
  },
});
kick();

</script>
</body>
