<!doctype html>
<html lang="en" data-theme="light" data-embed>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pencil sharpener</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0c0d0e; --panel:#141516; --edge:#222426;
    --line:#3d4144; --detail:#2b2e30; --body:#17181a; --deck:#1b1d1f;
    --ink:#868b8f; --ink-hi:#e6e8e9; --live:#f4f5f5;
    --glass:#0f1011; --glass-on:#1a1410; --recess:#0e0f10;
    --accent:#ff9a2e; --accent-hi:#ffc77a; --accent-dim:rgba(255,154,46,.10);
    --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8e9397; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#6a6f73; --ink-hi:#16181a; --live:#0c0d0e;
    --glass:#dcdede; --glass-on:#f3e6da; --recess:#e2e4e4;
    --accent:#ff9a2e; --accent-hi:#ffc77a; --accent-dim:rgba(255,154,46,.10);
  } }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8e9397; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#6a6f73; --ink-hi:#16181a; --live:#0c0d0e;
    --glass:#dcdede; --glass-on:#f3e6da; --recess:#e2e4e4;
    --accent:#ff9a2e; --accent-hi:#ffc77a; --accent-dim:rgba(255,154,46,.10);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13px; padding:20px 16px 32px; }
  .wrap { max-width:1180px; margin-inline:auto; display:grid; gap:14px; }
  .top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 18px; text-transform:uppercase; letter-spacing:.14em; padding:0 4px; }
  .top .hi { color:var(--ink-hi); }
  .top .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); margin-right:10px; vertical-align:1px; }
  .arrows { display:flex; gap:6px; }
  .arrows button, nav button { font:inherit; color:inherit; background:none; border:1px solid var(--edge); border-radius:10px; cursor:pointer; }
  .arrows button { padding:6px 12px; letter-spacing:.14em; text-transform:uppercase; }
  .arrows button:hover { color:var(--ink-hi); border-color:var(--line); }
  .top .hi { margin-right:auto; }
  .swatches { display:flex; align-items:center; gap:4px; padding:4px; border:1px solid var(--edge); border-radius:999px; }
  .swatches button { width:26px; height:26px; border-radius:50%; border:1px solid transparent; background:none; cursor:pointer; display:grid; place-items:center; padding:0; }
  .swatches button i { width:12px; height:12px; border-radius:50%; background:var(--sw); border:1px solid var(--line); box-shadow:0 0 0 0 var(--sw); transition:box-shadow .2s, transform .2s; }
  .swatches button:hover i { transform:scale(1.15); }
  .swatches button[aria-checked="true"] { border-color:var(--line); }
  .swatches button[aria-checked="true"] i { box-shadow:0 0 10px 1px var(--sw); }
  .swatches button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .layout { display:grid; grid-template-columns:230px minmax(0,1fr); grid-template-rows:auto 1fr; grid-template-areas:"nav fig" "credit fig"; gap:14px; align-items:start; }
  .layout > nav { grid-area:nav; } .layout > figure { grid-area:fig; } .layout > .credit { grid-area:credit; }
  .made-with { display:flex; justify-content:flex-end; padding:2px 6px 0; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  .made-with a { color:var(--line); text-decoration:none; transition:color .2s; }
  .made-with a:hover { color:var(--ink); }
  .credit { align-self:end; display:grid; gap:3px; padding:0 16px 22px; font-size:12px; line-height:1.5; letter-spacing:.04em; }
  .credit a { color:var(--ink); text-decoration:none; width:fit-content; transition:color .2s; }
  .credit a:hover { color:var(--ink-hi); }
  .credit a:hover .ar { color:var(--accent); }
  .credit .ar { color:var(--line); transition:color .2s; }
  .credit .by { color:var(--line); }
  .credit .nm { color:var(--ink); }
  .credit .cr { color:var(--line); margin-top:8px; font-size:11px; display:grid; gap:1px; }
  .credit .cr .hs { white-space:nowrap; }
  .credit .cr a { color:var(--line); }
  .credit .cr a:hover { color:var(--ink-hi); }
  .credit .soc { display:flex; gap:12px; margin-top:4px; }
  .credit .soc a { display:grid; place-items:center; width:16px; height:16px; }
  .credit .soc svg { width:14px; height:14px; fill:currentColor; transition:fill .2s; }
  .credit .soc a:hover svg { fill:var(--accent); }
  .credit a:focus-visible { outline:1px solid var(--accent); outline-offset:2px; border-radius:3px; }
  nav { display:grid; gap:4px; background:var(--panel); border:1px solid var(--edge); border-radius:22px; padding:14px; }
  nav button { display:flex; gap:12px; align-items:center; text-align:left; padding:9px 12px; border-color:transparent; letter-spacing:.06em; }
  nav button .n { color:var(--line); font-size:12px; transition:color .2s; }
  nav button:hover { color:var(--ink-hi); }
  nav button[aria-current="true"] { color:var(--ink-hi); border-color:var(--edge); background:var(--bg); }
  nav button[aria-current="true"] .n { color:var(--accent); text-shadow:0 0 8px var(--accent); }
  figure { margin:0; background:var(--panel); border:1px solid var(--edge); border-radius:22px; padding:22px 26px; display:grid; gap:6px; min-width:0; }
  .cap { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 18px; text-transform:uppercase; letter-spacing:.14em; }
  .cap .hi { color:var(--ink-hi); text-transform:none; letter-spacing:.05em; }
  #stageHolder { aspect-ratio:4/3; border-radius:14px; transition:background .5s; background:radial-gradient(ellipse 50% 45% at 50% 52%, transparent, transparent); }
  #stageHolder.glow { background:radial-gradient(ellipse 50% 45% at 50% 52%, var(--accent-dim), transparent 72%); }
  #stage { width:100%; height:100%; display:block; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  #stage:focus { outline:none; }
  #stage:focus-visible { outline:1px dashed var(--line); outline-offset:4px; border-radius:8px; }
  .fx { position:absolute; width:0; height:0; overflow:hidden; }
  @media (max-width: 820px) {
    .layout { grid-template-columns:1fr; grid-template-rows:auto; grid-template-areas:"nav" "fig" "credit"; }
    .credit { padding:4px 8px 0; display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; }
    .credit .soc { margin-top:0; }
    .credit .cr { margin-top:0; flex-basis:100%; }
    nav { position:relative; top:0; display:flex; overflow-x:auto; border-radius:16px; padding:8px; scrollbar-width:none; }
    nav button { flex:none; padding:8px 10px; }
    figure { padding:16px; }
  }

  /* ---------- shared figure vocabulary ---------- */
  #stage text { font-family:var(--mono); }
  .face { fill:var(--body); stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .face.top { fill:var(--deck); }
  .face.recess { fill:var(--recess); }
  .detail { fill:none; stroke:var(--detail); stroke-width:1; vector-effect:non-scaling-stroke; }
  .label { fill:var(--ink); font-family:var(--mono); }
  .glass { fill:var(--glass); transition:fill .3s, stroke .3s; }
  .glass.hot { fill:var(--glass-on); stroke:var(--accent); }
  .halo { fill:var(--accent); opacity:0; transition:opacity .4s; }
  .halo.hot { opacity:.22; }
  .scr { fill:var(--accent-hi); font-family:var(--mono); }
  .scr-accent { fill:var(--accent); }
  .led { fill:var(--detail); transition:fill .2s; }
  .led.hot { fill:var(--accent); }
  .wire { fill:none; stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linecap:round; stroke-linejoin:round; transition:stroke .4s; }
  .wire.hot { stroke:var(--accent); }
  .wire-under { fill:none; stroke:var(--panel); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
  .pulse { fill:none; stroke:var(--accent-hi); stroke-width:2.2; stroke-linecap:round; vector-effect:non-scaling-stroke;
           stroke-dasharray:70 1200; stroke-dashoffset:70; opacity:0; }
  .pulse.go { animation:flow .55s linear; }
  @keyframes flow { 0% { stroke-dashoffset:70; opacity:1; } 90% { opacity:1; } 100% { stroke-dashoffset:-1000; opacity:0; } }
  .press { cursor:pointer; transition:transform 60ms ease-out; }
  .press.down { transform:translateY(3px); }
  .press .face { transition:fill .6s ease-out, stroke .6s ease-out; }
  .press.lit .face, .press.latched .face { fill:var(--accent); stroke:var(--accent-hi); transition:none; }
  .press.lit .face.top, .press.latched .face.top { fill:var(--accent-hi); }
  .press.lit { filter:url(#glow); }
  .press.latched { filter:url(#soft); }
  .press:hover .face.top { stroke:var(--ink); }
  .blink { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion:reduce) {
    .press, .glass, .halo, .press .face, .wire { transition:none; } .blink { animation:none; } .pulse.go { animation:none; }
  }
</style>

<style>/* ===== Colorfigures 2.0: paper theme, colour per face, 3D props ===== */
  :root[data-theme="light"] {
    --bg:#ece8de; --panel:#f6f3ec; --edge:#ddd6c8; --line:#b3ab9b; --detail:#c9c1b2;
    --ink:#857d6e; --ink-hi:#231e16; --live:#231e16; --glass:#dfe7e9; --recess:#2b2523;
    --inkc:#231e16;                      /* the drawing's ink */
    --c-top:#f6957b; --c-front:#ef6a4c; --c-side:#4a2219; --c-mid:#cf5038;   /* body colour, set by the swatches */
  }
  body { background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .33  .14 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"); }
  #stage { filter:url(#hand); overflow:visible; }
  /* faces: the x-max face (box SIDE, lower right) is the lit front, the y-max face (box FRONT, lower left) is in shade */
  #stage .face { fill:var(--c-front); stroke:var(--inkc); stroke-width:1.5; }
  #stage .face.ff { fill:var(--c-side); }
  #stage .face.top { fill:var(--c-top); }
  /* materials: add to a face or to anything drawn on a face plane */
  #stage .face.metal, #stage .face.top.metal { fill:#d9dddd; } #stage .face.ff.metal { fill:#9ea6a9; }
  #stage .face.cream, #stage .face.top.cream { fill:#fff4d6; } #stage .face.ff.cream { fill:#d9cfae; }
  #stage .face.dark,  #stage .face.top.dark  { fill:#46413c; } #stage .face.ff.dark  { fill:#2a2724; }
  #stage .face.plate, #stage .face.top.plate { fill:#ddd8ca; } #stage .face.ff.plate { fill:#b9b3a4; }
  #stage .face.mid { fill:var(--c-mid); } #stage .face.top.mid { fill:color-mix(in srgb, var(--c-mid) 70%, var(--c-top)); } #stage .face.ff.mid { fill:color-mix(in srgb, var(--c-mid) 45%, var(--c-side)); }
  #stage .face.recess { fill:var(--recess); }
  #stage .face.inner { fill:color-mix(in srgb, var(--c-front) 55%, #fff); }   /* inside of a door or lid */
  #stage .face.win { fill:#e3eaec; }
  #stage .face.decal { fill:color-mix(in srgb, var(--c-side) 78%, #fff); }
  #stage .detail { stroke:var(--inkc); stroke-width:1.2; opacity:.7; }
  #stage .label { fill:var(--inkc); }
  #stage .label.on-side { fill:color-mix(in srgb, var(--c-side) 55%, #000); }
  /* glass over an opening (draw after what is behind it) */
  #stage .glass-tint { fill:#cfe9f0; opacity:.22; pointer-events:none; }
  #stage .streak { fill:#fff; opacity:.38; pointer-events:none; }
  /* 3D props from K.props (colour comes from style="--k:#hex") */
  #stage .prod { fill:var(--k); stroke:var(--inkc); stroke-width:1.1; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  #stage .prod-sh { fill:#000; opacity:.18; pointer-events:none; }
  #stage .prod-top { fill:color-mix(in srgb, var(--k) 68%, #fff); stroke:var(--inkc); stroke-width:.8; vector-effect:non-scaling-stroke; }
  #stage .prod-hi { stroke:#fff; stroke-width:1.4; opacity:.55; stroke-linecap:round; fill:none; vector-effect:non-scaling-stroke; pointer-events:none; }
  #stage .prod-label { fill:#fbf7ea; stroke:var(--inkc); stroke-width:.6; vector-effect:non-scaling-stroke; }
  #stage .prod-ink { fill:none; stroke:var(--inkc); stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  #stage .shelf { fill:#cfd6d8; stroke:var(--inkc); stroke-width:.7; vector-effect:non-scaling-stroke; }
  #stage .shelf-edge { fill:#a9b1b4; stroke:var(--inkc); stroke-width:.9; vector-effect:non-scaling-stroke; }
  /* "how it works" strip: the big idea + numbered steps; api.step(i) lights the current one */
  .explain { display:grid; gap:10px; margin-top:6px; padding-top:14px; border-top:1px solid var(--edge); }
  .explain .steps { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
  .explain .step { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; align-items:start; padding:10px 12px; border:1.5px solid var(--edge);
    border-radius:12px; background:var(--bg); font-size:12px; line-height:1.45; letter-spacing:.02em; color:var(--ink); transition:border-color .25s, background .25s, color .25s, box-shadow .25s; }
  .explain .step b { display:grid; place-items:center; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); font-size:11px; color:var(--ink); }
  .explain .step.on { border-color:var(--inkc); background:var(--panel); color:var(--ink-hi); box-shadow:3px 3px 0 var(--inkc); }
  .explain .step.on b { background:var(--c-front); border-color:var(--inkc); color:var(--inkc); }
  .explain .idea { font-size:12.5px; color:var(--ink-hi); letter-spacing:.02em; }
  .explain .idea strong { letter-spacing:.1em; text-transform:uppercase; font-size:11px; margin-right:6px; }
  /* embed mode (build.py --embed): just the figure card, no gallery chrome */
  :root[data-embed] .wrap > .top, :root[data-embed] .layout > nav, :root[data-embed] .made-with { display:none; }   /* not #stage .top (box tops)! */
  :root[data-embed] .layout { grid-template-columns:1fr; grid-template-areas:"fig"; }
  :root[data-embed] .wrap { max-width:900px; }
  /* text under the figure is off: the buttons and the motion tell the story (hint, status line, steps, big idea).
     Remove these two rules to bring it back. */
  figure > .cap:has(#hint), #explain { display:none !important; }
  /* action buttons: listed in the order you'd use them, top-left over the figure (click any, in any order) */
  .stagewrap { position:relative; }
  .acts { position:absolute; top:4px; left:0; z-index:2; display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  .acts button { font:inherit; font-size:12.5px; letter-spacing:.02em; color:var(--inkc); background:var(--panel); border:1.5px solid var(--inkc);
    border-radius:999px; padding:5px 14px; cursor:pointer; white-space:nowrap; }
  .acts button:hover { background:color-mix(in srgb, var(--panel) 90%, var(--inkc)); }
  .acts button:active { transform:translateY(1px); }
  @media (max-width:560px) { .acts { position:static; flex-direction:row; flex-wrap:wrap; gap:6px; margin-bottom:8px; } .acts button { font-size:12px; padding:4px 11px; }
    :root[data-embed] body { padding:10px 8px 16px; } :root[data-embed] figure { padding:12px; border-radius:16px; } }
  .wob { display:flex; align-items:center; gap:10px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  .wob input { accent-color:var(--inkc); width:160px; }
</style>
</head>

<svg class="fx" aria-hidden="true">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hand" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="warp"/>
      <feDisplacementMap id="wob" in="SourceGraphic" in2="warp" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="wb"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="11" result="n1"/>
      <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .84  .3 0 0 0 .84  .3 0 0 0 .84  0 0 0 0 1" result="grain"/>
      <feBlend in="wb" in2="grain" mode="multiply" result="g1"/><feComposite in="g1" in2="wb" operator="in"/></filter>
    <filter id="bloom" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
</svg>

  <div class="top">
    <span class="hi"><span class="dot"></span>Pencil sharpener</span>

    <!-- optional: <aside class="credit">Made by … <a href="…">…</a></aside> (styles below) -->

      <div class="cap"><span class="hi" id="fignum">Fig 1</span><span id="figname"></span></div>

      <div class="cap"><span id="hint"></span><span class="hi" id="readout"></span></div>

<script>
  // Gallery settings: palette 'ember' | 'city' | your own [[name, darkAccent, darkHi, lightAccent, lightHi], ...]
  window.GALLERY = { number: 6, palette: 'ember', autoDemo: false, storageKey: 'iso-glow-accent' };
  const FIGS = [];
</script>
<!-- FIGURES: one <script> per figure, each calling FIGS.push({...}). Order here = Fig 1, 2, 3 ... -->
<script>
// Colorfigures 2.0 · kids "How does it work?" · a crank pencil sharpener.
// Body from box(); a peek window on top over the slanted blade, a see-through shavings drawer on the lit front,
// a crank on the shaded side. The pencil is a real 3D hexagonal prism + cone that sharpens turn by turn.
FIGS.push({
  id: 'sharpener', name: 'Pencil sharpener', palette: 'tomato',
  hint: 'Hold the crank or TURN (space) · TAKE pencil (T) · EMPTY drawer (E)',
  aria: 'Isometric crank pencil sharpener with a peek window over the slanted blade and a see-through shavings drawer. Turn the crank to sharpen the pencil.',
  idea: 'The blade is set at a slant, so as the pencil turns it shaves the wood away in a cone and leaves a sharp point.',
  steps: ['Put the pencil in the hole and turn the crank.', 'The slanted blade shaves off thin curls of wood. They fall into the drawer.', 'Round and round, the end becomes a sharp cone.'],
  mount(stage, api) {
    const W = 70, D = 60, H = 58, Z0 = 4;               // body: x depth, y width, z height (sits on a desk plate)
    const PY = 23, PZ = 46;                              // pencil axis (runs along x, out of the lit front)
    const TIP = 18, CB = 33, RC = 3.9, RH = 4.3, BLEN = 70, OUT = 62;   // blade cone: tip..base, radii; body length; pull-out
    const hx = 24, hz = 34, CR = 17;                     // crank hub on the shaded side (y = D), arm length
    const DY0 = 8, DY1 = 52, DZ0 = 6, DZ1 = 28, DOUT = 22;   // shavings drawer
    const K = api.iso.frame([[-10,-10,0],[W+10,-10,0],[-10,D+22,0],[W+10,D+22,0],[0,0,Z0+H],[W,D,Z0+H],
      [hx, D+18, hz+CR+4], [hx-CR-4, D+18, hz], [hx, D+18, hz-CR-4],
      [CB+BLEN+OUT, PY, PZ+6], [CB+BLEN+OUT, PY+6, PZ-6], [W+DOUT, DY1, DZ0], [W+10, D+22, -16]]);
    const { P, TOP, FRONT, SIDE, box, boxc, props } = K;
    const { hull, poly, cylX, cylY, block } = props;
    const TZ = Z0 + H;                                   // top of the body
    const f1 = n => n.toFixed(1), dd = pts => 'M' + pts.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') + 'Z';
    const solid = (pts3, col, cls = 'prod') => `<path class="${cls}" style="--k:${col}" d="${dd(hull(pts3.map(p => P(...p))))}"/>`;
    const ring = (x, r, n = 24, ph = 0) => Array.from({ length: n }, (_, i) => { const a = ph + i / n * 2 * Math.PI; return [x, PY + r * Math.cos(a), PZ + r * Math.sin(a)]; });
    const rad = x => Math.max(0, RC * (x - TIP) / (CB - TIP));       // the blade's slant: cone radius at x
    // a wood shaving: a frilly fan curl with the yellow paint on its edge
    const curl = (x, y, s, a) => `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${Math.round(a)}) scale(${s})">
      <path d="M-3 0a3 3 0 1 0 3-3" fill="#f0c98e" stroke="#f2b822" stroke-width="1" stroke-dasharray="1.1 .5"/>
      <path d="M-1.5 .2a1.5 1.5 0 1 0 1.5-1.7" fill="none" stroke="#8a5a3c" stroke-width=".45"/></g>`;

    const st = { s: 0, th: -Math.PI / 2, phi: 0, sh: 0, out: false, drawer: 0, pile: 0, falling: [], turns: 0,
                 turning: null, holding: false, peel: 0, busy: false, msg: '' };

    // ---------- the pencil (shift sh along x; only the part with x >= xmin) ----------
    function pencil(sh, xmin = -1e9) {
      const s = st.s, rt = RC * .66 * (1 - s) + .12 * s;              // tip radius: blunt -> needle
      const tipX = TIP + (CB - TIP) * rt / RC + sh, cb = CB + sh, e = CB + BLEN - 8 * s + sh;   // shorter as it sharpens
      let g = '';
      if (rt > 1.3 && tipX - 1 >= xmin) g += solid([...ring(tipX - 1, .8), ...ring(tipX, 1.3)], '#3d3a38');   // blunt graphite nub
      const x0 = Math.max(tipX, xmin);
      if (x0 < cb) {
        g += solid([...ring(x0, rad(x0 - sh)), ...ring(cb, RC)], '#eab676');                   // shaved wood cone
        const xg = TIP + (CB - TIP) * 1.3 / RC + sh;
        if (rt < 1.3 && xg > x0) g += solid([...ring(x0, rad(x0 - sh)), ...ring(xg, 1.3)], '#3d3a38');   // graphite point
      }
      const h0 = Math.max(cb, xmin), h1 = e - 10;
      if (h0 < h1) {                                                   // hexagonal yellow body, visible facets only
        const v = k => { const a = st.phi + k * Math.PI / 3; return [PY + RH * Math.cos(a), PZ + RH * Math.sin(a)]; };
        for (let k = 0; k < 6; k++) {
          const m = st.phi + (k + .5) * Math.PI / 3, c = Math.cos(m), sn = Math.sin(m);
          if (c + sn <= 0) continue;
          const col = sn > .6 ? '#ffd95a' : sn > -.2 ? '#f6c234' : '#dba11c';
          const [ya, za] = v(k), [yb, zb] = v(k + 1);
          g += poly([[h0, ya, za], [h1, ya, za], [h1, yb, zb], [h0, yb, zb]], 'prod', col);
        }
      }
      g += cylX(Math.max(e - 10, xmin), e - 4, PY, PZ, 4.5, '#c9cfd2') + cylX(e - 4, e, PY, PZ, 4.2, '#f28fa6');   // ferrule, eraser
      return g;
    }

    // ---------- static drawing ----------
    let svg = boxc(-10, -10, 0, W + 20, D + 32, Z0, 6, 'plate');            // desk
    svg += box(0, 0, Z0, W, D, H, 6);                                        // body
    // shaded side: a name sticker under the crank
    svg += `<g transform="${FRONT(0, D, TZ)}"><rect class="face decal" x="40" y="40" width="24" height="10" rx="3"/>
      <text class="label on-side" x="52" y="47.2" text-anchor="middle" font-size="5" font-weight="800">SHARPY</text></g>`;
    svg += cylY(D, D + 4, hx, hz, 6, '#c9cfd2');                            // crank hub
    // top: peek window over the cutter (content 12 below shows shifted +12 in x and y)
    svg += `<g transform="${TOP(6, 10, TZ)}"><rect class="face mid" x="-2" y="-2" width="60" height="44" rx="5"/><rect class="face recess" width="56" height="40" rx="4"/></g>
      <clipPath id="sh-peek"><rect transform="${TOP(6, 10, TZ)}" width="56" height="40" rx="4"/></clipPath>
      <g clip-path="url(#sh-peek)" id="sh-in"></g>
      <g transform="${TOP(6, 10, TZ)}" style="pointer-events:none"><rect class="glass-tint" width="56" height="40" rx="4"/>
        <path class="streak" d="M8 0 L14 0 L4 40 L-2 40Z"/><path class="streak" d="M18 0 L20 0 L10 40 L8 40Z"/></g>`;
    // lit front: hole with a metal collar
    svg += cylX(W, W + 2.5, PY, PZ, 6.5, '#c9cfd2') + `<g transform="${SIDE(W + 2.5, PY, PZ)}"><circle class="face recess" r="4.9"/></g>`;
    svg += `<g id="sh-drawer" class="press"></g><g id="sh-crank" class="press"></g><g id="sh-out"></g><g id="sh-ui"></g>`;
    stage.setAttribute('viewBox', K.viewBox); stage.innerHTML = svg;
    const $ = s => stage.querySelector(s), inG = $('#sh-in'), drawerG = $('#sh-drawer'), crankG = $('#sh-crank'), outG = $('#sh-out'), uiG = $('#sh-ui');

    // screen-space buttons along the bottom
    const u = K.W / 100, BTN = [['turn', 'TURN', 'space'], ['take', 'TAKE PENCIL', 'T'], ['empty', 'EMPTY DRAWER', 'E']];
    const bw = [20, 25, 26];
    let bx = 3 * u;
    uiG.innerHTML = BTN.map(([id, t, k], i) => { const x = bx, w = bw[i] * u; bx += w + 2 * u;
      return `<g class="press" id="sh-b-${id}" style="cursor:pointer"><rect class="face cream" x="${f1(x)}" y="${f1(K.H - 9 * u)}" width="${f1(w)}" height="${f1(5.6 * u)}" rx="${f1(2.8 * u)}"/>
        <text class="label" id="sh-t-${id}" x="${f1(x + w / 2)}" y="${f1(K.H - 5.4 * u)}" text-anchor="middle" font-size="${f1(2.3 * u)}" font-weight="800">${t} (${k})</text></g>`; }).join('');

    // ---------- render ----------
    function render() {
      // inside the peek window: blade holder, slanted blade, pencil, a curl peeling off
      let g = block(12, 2, 38, 36, 10, 46.5, '#46413c');
      const bz = 47.2, E0 = [TIP - 1, PY - .2, bz], E1 = [CB + 4, PY - rad(CB + 4) - .2, bz];
      g += poly([E0, E1, [CB + 4, E1[1] - 7, bz], [TIP - 3, PY - 6, bz]], 'prod', '#dfe5e7');
      g += `<path class="prod-ink" style="stroke-width:1.8;stroke:#fff;opacity:.8" d="${K.path([E0, E1])}"/>`;
      const sc = P(26, PY - 9, bz); g += `<circle cx="${f1(sc[0])}" cy="${f1(sc[1])}" r="1.5" fill="#8d9699" stroke="#231e16" stroke-width=".5"/>`;
      g += pencil(st.sh);
      if (st.peel > 0) { const p = P(25, PY - rad(25) - 2.5, 49); g += curl(p[0], p[1], .5 + st.peel * .6, st.peel * 300); }
      inG.innerHTML = g;

      // drawer: open top + side when pulled out, then the clear front with the shaving pile behind it
      const o = st.drawer, X = W + .6 + o;
      let d = '';
      if (o > .5) d += poly([[W, DY0, DZ1], [W + o, DY0, DZ1], [W + o, DY1, DZ1], [W, DY1, DZ1]], 'face recess')
                    + poly([[W, DY1, DZ0], [W + o, DY1, DZ0], [W + o, DY1, DZ1], [W, DY1, DZ1]], 'face ff mid');
      const T = SIDE(X, DY1, DZ1);
      let pile = '';
      for (let n = 0; n < st.pile; n++) { const [pu, pv] = slot(n); pile += curl(pu, pv, .85, n * 77); }
      st.falling.forEach(c => { pile += curl(c.u, c.v, .85, c.a); });
      d += `<g transform="${T}"><rect class="face mid" width="${DY1 - DY0}" height="${DZ1 - DZ0}" rx="2"/><rect class="face win" x="3" y="3" width="38" height="15" rx="1.5"/></g>
        <clipPath id="sh-dw"><rect transform="${T}" x="3" y="3" width="38" height="15" rx="1.5"/></clipPath>
        <g clip-path="url(#sh-dw)"><g transform="${T}">${pile}</g></g>
        <g transform="${T}"><rect class="glass-tint" x="3" y="3" width="38" height="15" rx="1.5"/><path class="streak" d="M10 18 L16 3 L19 3 L13 18Z"/>
          <rect class="face dark" x="16" y="19.2" width="12" height="1.8" rx=".9"/></g>`;
      drawerG.innerHTML = d;

      // crank: hub cap, arm, wooden handle (all in front of the shaded side)
      const ex = hx + CR * Math.cos(st.th), ez = hz + CR * Math.sin(st.th), nx = -Math.sin(st.th) * 2.4, nz = Math.cos(st.th) * 2.4, yA = D + 4.2;
      crankG.innerHTML = poly([[hx + nx, yA, hz + nz], [ex + nx, yA, ez + nz], [ex - nx, yA, ez - nz], [hx - nx, yA, hz - nz]], 'prod', '#a7b0b3')
        + cylY(D + 4, D + 5.4, hx, hz, 3.4, '#8d9699') + cylY(D + 4.2, D + 17, ex, ez, 3, '#c98a4a', '#e6b07a');

      // the pencil outside the body (drawn last: it is nearest)
      outG.innerHTML = pencil(st.sh, W + 2.5);

      $('#sh-t-take').textContent = st.out ? (st.s >= 1 ? 'NEW PENCIL (T)' : 'PUT IT BACK (T)') : 'TAKE PENCIL (T)';
      const pct = Math.round(st.s * 100);
      api.readout(st.msg || (st.out ? (st.s >= 1 ? 'look at that point! sharp' : `out · ${pct}% sharp`) :
        `${st.s >= 1 ? 'sharp!' : st.s ? 'getting sharper' : 'blunt'} · ${pct}% · turns ${st.turns} · shavings ${st.pile}`));
    }
    function slot(n) {                     // where the n-th shaving settles in the drawer (face-local u, v)
      const r = Math.sin(n * 12.9898) * 43758.5453, fr = r - Math.floor(r);
      return [7 + fr * 30, 16 - Math.floor(n / 7) * 2.4 - (n % 3) * .6];
    }
    const say = (m, ms = 1400) => { st.msg = m; render(); api.after(ms, () => { st.msg = ''; render(); }); };

    // ---------- motion: one ticker drives every tween ----------
    function tween(ms, step, done) { const t0 = performance.now(); const id = api.every(30, () => {
      const k = Math.min(1, (performance.now() - t0) / ms); step(k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2); render();
      if (k >= 1) { clearInterval(id); done && done(); } }); }
    api.every(40, () => {                  // falling shavings
      if (!st.falling.length) return;
      st.falling.forEach(c => { c.v = Math.min(c.tv, c.v + 1.1); c.a += 14; });
      const landed = st.falling.filter(c => c.v >= c.tv); st.falling = st.falling.filter(c => c.v < c.tv);
      st.pile += landed.length; render();
    });

    function turn() {
      if (st.turning || st.busy) return;
      const cutting = !st.out && st.s < 1;
      st.turning = true; api.flash($('#sh-b-turn'));
      api.step(0);
      if (cutting) api.after(180, () => api.step(1));
      const th0 = st.th, ph0 = st.phi, s0 = st.s, s1 = Math.min(1, st.s + .2);
      if (cutting) [140, 300, 460].forEach((ms, i) => api.after(ms, () => {
        if (st.pile + st.falling.length >= 42) return;
        const [su, sv] = slot(st.pile + st.falling.length); st.falling.push({ u: su, v: -2, tv: sv, a: i * 90 });
      }));
      tween(650, k => {
        st.th = th0 + k * 2 * Math.PI; st.phi = ph0 + k * 2 * Math.PI;
        if (cutting) { st.s = s0 + (s1 - s0) * k; st.peel = Math.sin(k * Math.PI); }
      }, () => {
        st.turning = false; st.peel = 0;
        if (cutting) { st.turns++; if (st.s >= .6) api.step(2); if (st.s >= 1) say('sharp! take the pencil (T)', 2000); }
        else say(st.out ? 'no pencil in the hole' : 'already sharp! take the pencil (T)');
        render();
        if (st.holding) turn();
      });
    }
    function take() {
      if (st.busy || st.turning) return;
      st.busy = true; api.flash($('#sh-b-take')); api.step(-1);
      const from = st.sh, goOut = !st.out;
      if (!goOut && st.s >= 1) { st.s = 0; st.turns = 0; }          // a fresh blunt pencil
      tween(550, k => { st.sh = goOut ? from + (OUT - from) * k : from * (1 - k); }, () => {
        st.out = goOut; st.busy = false; if (goOut && st.s >= 1) api.step(2); render(); });
    }
    function empty() {
      if (st.busy) return;
      st.busy = true; api.flash($('#sh-b-empty'));
      tween(380, k => { st.drawer = DOUT * k; }, () => api.after(350, () => {
        st.pile = 0; st.falling = []; render();
        tween(380, k => { st.drawer = DOUT * (1 - k); }, () => { st.busy = false; say('drawer empty'); });
      }));
    }
    const hold = on => { st.holding = on; if (on) turn(); };
    stage.addEventListener('pointerdown', e => {
      if (e.target.closest('#sh-crank, #sh-b-turn')) { e.preventDefault(); hold(true); }
    });
    const up = () => { st.holding = false; };
    window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    stage.addEventListener('click', e => {
      if (e.target.closest('#sh-b-take, #sh-out')) return take();
      if (e.target.closest('#sh-b-empty, #sh-drawer')) return empty();
    });
    render();
    return {
      actions: [{label:'Turn the crank', run:() => { hold(true); api.after(1500, () => { st.holding = false; }); }}, {label:'Take the pencil', run:take}, {label:'Empty the drawer', run:empty}],
      key: e => { const k = e.key.toLowerCase();
        if (k === ' ' || k === 'enter') { if (!e.repeat) hold(true); return true; }
        if (k === 't') return take(), true;
        if (k === 'e') return empty(), true; return false; },
      keyup: e => { if (e.key === ' ' || e.key === 'Enter') st.holding = false; },
      unmount: () => { window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); },
      demo: () => { hold(true); api.after(3400, () => { st.holding = false; }); api.after(4300, take); },
    };
  },
});

</script>
<!-- CORE: kernel, api, navigation, palette picker. Keep after the figures. -->
<script>
/* ============================================================
   iso gallery core: kernel, shared api, navigation.
   Figures register with FIGS.push({...}) — see CONTRACT below.
   ============================================================ */
// FIGS is declared inline in the page before the figure scripts

const ISO = (() => {
  const C = Math.cos(Math.PI / 6), S = Math.sin(Math.PI / 6);
  function kernel(OX, OY) {
    const P = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];
    const D = (x,y,z) => [(x-y)*C, (x+y)*S - z];
    const plane = (O,U,V) => { const o=P(...O), u=D(...U), v=D(...V);
      return `matrix(${u[0]} ${u[1]} ${v[0]} ${v[1]} ${o[0]} ${o[1]})`; };
    const TOP   = (x,y,z) => plane([x,y,z],[1,0,0],[0,1,0]);
    const FRONT = (x,y,z) => plane([x,y,z],[1,0,0],[0,0,-1]);
    const SIDE  = (x,y,z) => plane([x,y,z],[0,-1,0],[0,0,-1]);
    const rect = (t,w,h,r=0,cls='face') => `<g transform="${t}"><rect class="${cls}" width="${w}" height="${h}" rx="${r}"/></g>`;
    // Rounded box: one rounded top plus one continuous side wall along the visible part of the
    // outline, so the corners meet cleanly. r = 0 keeps the classic three flat faces.
    const rounded = (x,y,z,w,d,h,r,cls) => {
      r = Math.min(r, w/2, d/2);
      const n = 10, z1 = z + h, q = Math.PI/4, H = Math.PI/2, c = cls ? ' ' + cls : '';
      const arc = (cx,cy,a0,a1) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1-a0)*i/n; o.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]); } return o; };
      const ring = [...arc(x+w-r,y+r,-H,0), ...arc(x+w-r,y+d-r,0,H), ...arc(x+r,y+d-r,H,2*H), ...arc(x+r,y+r,2*H,3*H)];
      // the visible wall, split at the front corner: the part facing +x is the lit front, the part facing +y is in shade
      const lit  = [...arc(x+w-r,y+r,-q,0), ...arc(x+w-r,y+d-r,0,q)];
      const shad = [...arc(x+w-r,y+d-r,q,H), ...arc(x+r,y+d-r,H,3*q)];
      const d3 = pts => 'M' + pts.map(p => P(...p).map(v => v.toFixed(2)).join(' ')).join('L') + 'Z';
      const wall = v => d3([...v.map(([a,b]) => [a,b,z]), ...v.slice().reverse().map(([a,b]) => [a,b,z1])]);
      return `<path class="face ff${c}" d="${wall(shad)}"/><path class="face sf${c}" d="${wall(lit)}"/><path class="face top${c}" d="${d3(ring.map(([a,b]) => [a,b,z1]))}"/>`;
    };
    const box = (x,y,z,w,d,h,r=0) => r > 0 ? rounded(x,y,z,w,d,h,r,'') :
      rect(SIDE(x+w,y+d,z+h), d,h,0,'face sf') + rect(FRONT(x,y+d,z+h), w,h,0,'face ff') + rect(TOP(x,y,z+h), w,d,0,'face top');
    const boxc = (x,y,z,w,d,h,r,cls) => r > 0 ? rounded(x,y,z,w,d,h,r,cls) :
      rect(SIDE(x+w,y+d,z+h), d,h,0,'face sf '+cls) + rect(FRONT(x,y+d,z+h), w,h,0,'face ff '+cls) + rect(TOP(x,y,z+h), w,d,0,'face top '+cls);
    // 3D polyline -> SVG path "d"
    const path = pts => 'M' + pts.map(p => P(...p).map(n => n.toFixed(2)).join(' ')).join('L');
    return { C, S, P, D, plane, TOP, FRONT, SIDE, rect, box, boxc, path };
  }

  /* ---------- 3D props (Colorfigures 2.0): round and boxy things that need real depth ----------
     Every helper takes kernel 3D coordinates (x down-right, y down-left, z up) and returns an SVG string.
     Colour: pass a hex; it becomes --k for the .prod classes. Draw props back to front (backToFront). */
  function props(P) {
    const f = v => v.toFixed(1), d2 = pts => 'M' + pts.map(q => f(q[0]) + ' ' + f(q[1])).join('L') + 'Z';
    const hull = pts => { pts = pts.slice().sort((a,b) => a[0]-b[0] || a[1]-b[1]);
      const cr = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]), lo = [], up = [];
      for (const p of pts){ while (lo.length > 1 && cr(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
      for (const p of pts.reverse()){ while (up.length > 1 && cr(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
      lo.pop(); up.pop(); return lo.concat(up); };
    const poly = (pts3, cls = 'prod', col) => `<path class="${cls}"${col ? ` style="--k:${col}"` : ''} d="${d2(pts3.map(p => P(...p)))}"/>`;
    const arcZ = (x,y,z,r,a0,a1,n=12) => Array.from({length:n+1}, (_,i) => { const a = (a0 + (a1-a0)*i/n)*Math.PI/180; return P(x + r*Math.cos(a), y + r*Math.sin(a), z); });
    const ringZ = (x,y,z,r) => arcZ(x,y,z,r,0,360,24);
    // upright cylinder: body, shaded +y half, top cap (lid colour optional), highlight
    function cyl(x,y,z,h,r,col,lid){
      const a = ringZ(x,y,z,r), b = ringZ(x,y,z+h,r), sh = [...arcZ(x,y,z,r,50,140), ...arcZ(x,y,z+h,r,140,50)];
      return `<path class="prod" style="--k:${col}" d="${d2(hull([...a,...b]))}"/><path class="prod-sh" d="${d2(sh)}"/>`
           + `<path class="prod-top" style="--k:${lid || col}" d="${d2(b)}"/>`
           + (r > 2.5 ? `<path class="prod-hi" d="M${P(x+r*.95,y-r*.3,z+h*.12).map(f).join(' ')}L${P(x+r*.95,y-r*.3,z+h*.88).map(f).join(' ')}"/>` : '');
    }
    // cylinder lying along x (a knob or dial sticking out of an x-max face, or a pipe): from x0 to x1, centred (y,z)
    function cylX(x0,x1,y,z,r,col){
      const ring = x => Array.from({length:24}, (_,i) => { const a = i/24*2*Math.PI; return P(x, y + r*Math.cos(a), z + r*Math.sin(a)); });
      const A = ring(x0), B = ring(x1);
      return `<path class="prod" style="--k:${col}" d="${d2(hull([...A,...B]))}"/><path class="prod-top" style="--k:${col}" d="${d2(B)}"/>`;
    }
    // cylinder lying along y (a can in a tray, a rolled towel): from y0 to y1, centred (x,z); the +y end cap shows
    function cylY(y0,y1,x,z,r,col,cap){
      const ring = y => Array.from({length:24}, (_,i) => { const a = i/24*2*Math.PI; return P(x + r*Math.cos(a), y, z + r*Math.sin(a)); });
      return `<path class="prod" style="--k:${col}" d="${d2(hull([...ring(y0), ...ring(y1)]))}"/><path class="prod-top" style="--k:${cap || col}" d="${d2(ring(y1))}"/>`;
    }
    // small box with its own colour: +y face (shaded), +x face, top
    function block(x0,y0,z0,x1,y1,z1,col){
      const fy = [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]];
      return poly(fy,'prod',col) + poly(fy,'prod-sh') + poly([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],'prod',col)
           + poly([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],'prod-top',col);
    }
    const can    = (x,y,z,col) => cyl(x,y,z,21,6,col,'#e3e7e8');
    const bottle = (x,y,z,col) => cyl(x,y,z,15,5.5,col) + cyl(x,y,z+15,6,2.4,'#cfe6ea') + cyl(x,y,z+21,3,2.8,col);
    const pack   = (x,y,z,col) => block(x-3.5,y-7,z,x+3.5,y+7,z+21,col) + poly([[x+3.6,y-5,z+8],[x+3.6,y+5,z+8],[x+3.6,y+5,z+13],[x+3.6,y-5,z+13]],'prod-label');
    // cup with a handle on the -y side (drawn behind) and an optional liquid level 0..1
    function cup(x,y,z,col='#fbfaf3',level=0,liquid='#4a2b18'){
      const r = 5, h = 7, hp = [[x,y-r,z+h*.8],[x,y-r-3,z+h*.75],[x,y-r-3.4,z+h*.35],[x,y-r,z+h*.25]].map(p => P(...p));
      let s = `<path class="prod-ink" style="stroke-width:3.4" d="M${hp.map(q => f(q[0])+' '+f(q[1])).join('L')}"/>`;
      s += cyl(x,y,z,h,r,col);
      s += `<path class="prod-top" style="--k:#8a8378" d="${d2(ringZ(x,y,z+h,r-.7))}"/>`;
      if (level > 0) s += `<path class="prod" style="--k:${liquid}" d="${d2(ringZ(x,y,z+h-.6-(1-level)*2,r-.9))}"/>`;
      return s;
    }
    // round knob or button sticking out of an x-max face
    const knob = (x,y,z,r,col='#d9dddd',depth=2.5) => cylX(x, x + depth, y, z, r, col);
    // door on an x-max (front) face, hinged on its RIGHT edge (the low-y side, y = hingeY), closed it spans
    // y = hingeY .. hingeY + width and z = z0 .. z1 in the plane x. angle in degrees: 0 closed, 60–75 reads best
    // (past ~90° it turns edge-on from this viewpoint). Past 45° the inside face shows (class 'face inner').
    // Returns { svg, free:[x,y] } — free is where the free edge is, handy for placing a handle.
    function door(x, hingeY, width, z0, z1, angle, cls = 'face', thick = 2){
      const a = angle*Math.PI/180, fx = x + width*Math.sin(a), fy = hingeY + width*Math.cos(a);
      const outer = [[x,hingeY,z0],[fx,fy,z0],[fx,fy,z1],[x,hingeY,z1]];
      const showsOutside = Math.cos(a) - Math.sin(a) > 0;     // its outward normal (cos a, -sin a) points at the viewer
      const edge = [[fx,fy,z0],[fx - Math.cos(a)*thick, fy + Math.sin(a)*thick, z0],[fx - Math.cos(a)*thick, fy + Math.sin(a)*thick, z1],[fx,fy,z1]];
      let svg = poly(edge, 'face ff ' + cls.replace(/\bface\b/,'').trim());
      svg += poly(outer, showsOutside ? cls : 'face inner');
      return { svg, free:[fx, fy] };
    }
    // sort parts back to front: [{at:[x,y,z], svg}] -> string (larger x+y+z is nearer the viewer)
    const backToFront = parts => parts.filter(Boolean).sort((a,b) => (a.at[0]+a.at[1]+a.at[2]) - (b.at[0]+b.at[1]+b.at[2])).map(p => p.svg).join('');
    return { hull, poly, cyl, cylX, cylY, block, can, bottle, pack, cup, knob, door, backToFront, ringZ };
  }
  // Frame a scene: pass its extreme 3D corners. Returns kernel + viewBox padded to ~4:3.
  function frame(points, margin = 0.09, aspect = 4 / 3) {
    const d = points.map(([x,y,z]) => [(x-y)*C, (x+y)*S - z]);
    let x0 = Math.min(...d.map(p => p[0])), x1 = Math.max(...d.map(p => p[0]));
    let y0 = Math.min(...d.map(p => p[1])), y1 = Math.max(...d.map(p => p[1]));
    const m = margin * Math.max(x1 - x0, y1 - y0);
    let w = x1 - x0 + 2*m, h = y1 - y0 + 2*m;
    let ox = m - x0, oy = m - y0;
    if (w / h < aspect) { const nw = h * aspect; ox += (nw - w) / 2; w = nw; }
    else { const nh = w / aspect; oy += (nh - h) / 2; h = nh; }
    const k = kernel(ox, oy);
    return { ...k, props: props(k.P), viewBox: `0 0 ${w.toFixed(1)} ${h.toFixed(1)}`, W: w, H: h };
  }
  // repeated detail lines in a face-local group
  const slits = (a0, a1, step, b0, b1, vertical = true, cls = 'detail') => {
    let s = ''; for (let a = a0; a <= a1 + 1e-6; a += step)
      s += vertical ? `<line class="${cls}" x1="${a}" y1="${b0}" x2="${a}" y2="${b1}"/>` : `<line class="${cls}" x1="${b0}" y1="${a}" x2="${b1}" y2="${a}"/>`;
    return s;
  };
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return { kernel, frame, slits, esc };
})();

/* ---------- shared audio (created on first user gesture) ---------- */
const AUDIO = (() => {
  let ctx = null, out = null, analyser = null;
  return () => {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      out = ctx.createGain(); out.gain.value = 0.5;
      analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
      out.connect(analyser); analyser.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return { ctx, out, analyser };
  };
})();

/* ---------- app ---------- */
(function app() {
  const $ = id => document.getElementById(id);
  const CFG = window.GALLERY || {};
  const holder = $('stageHolder'), readoutEl = $('readout'), hintEl = $('hint'), numEl = $('fignum'), nameEl = $('figname');
  const nav = $('nav');
  let active = null, handle = null, timers = [], frames = [], idx = 0;

  const api = {
    iso: ISO,
    readout: s => { readoutEl.textContent = s; },
    hint: s => { hintEl.textContent = s; },
    audio: AUDIO,
    after: (ms, fn) => { const t = setTimeout(fn, ms); timers.push(t); return t; },
    every: (ms, fn) => { const t = setInterval(fn, ms); timers.push(t); return t; },
    loop: fn => { let alive = true; const f = ts => { if (!alive) return; fn(ts); requestAnimationFrame(f); };
      requestAnimationFrame(f); const stop = () => { alive = false; }; frames.push(stop); return stop; },
    // light a pressable briefly (orange flash + glow, then fade)
    flash: (el, ms = 160) => { if (!el) return; el.classList.add('down', 'lit'); clearTimeout(el._f1); clearTimeout(el._f2);
      el._f1 = setTimeout(() => el.classList.remove('down'), 110); el._f2 = setTimeout(() => el.classList.remove('lit'), ms); },
    // restart a one-shot CSS animation class (e.g. '.pulse' -> 'go')
    replay: (el, cls = 'go') => { if (!el) return; el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); },
    power: on => { holder.classList.toggle('glow', !!on); },
    // light step i of the figure's "how it works" strip (0-based; -1 = none)
    step: i => { document.querySelectorAll('#explain .step').forEach((el, k) => el.classList.toggle('on', k === i)); },
  };

  function mount(i) {
    if (handle && handle.unmount) handle.unmount();
    timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = [];
    frames.forEach(stop => stop()); frames = [];
    idx = (i + FIGS.length) % FIGS.length; active = FIGS[idx];
    setBody(chosen[active.id] || active.palette);
    holder.classList.remove('glow');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('id', 'stage'); svg.setAttribute('role', 'img'); svg.setAttribute('tabindex', '0');
    svg.setAttribute('aria-label', active.aria || active.name);
    svg.dataset.fig = active.id;
    holder.replaceChildren(svg);
    numEl.textContent = `Fig ${CFG.number || idx + 1}`; nameEl.textContent = active.name;
    hintEl.textContent = active.hint || ''; readoutEl.textContent = '';
    const ex = $('explain'), steps = active.steps || [];
    ex.hidden = !(active.idea || steps.length);
    ex.innerHTML = (steps.length ? `<div class="steps">${steps.map((t, k) => `<div class="step"><b>${k + 1}</b><span>${t}</span></div>`).join('')}</div>` : '')
      + (active.idea ? `<div class="idea"><strong>The big idea</strong>${active.idea}</div>` : '');
    document.title = `Fig ${CFG.number || idx + 1} · ${active.name}`;
    [...nav.querySelectorAll('button[data-i]')].forEach(b => b.setAttribute('aria-current', +b.dataset.i === idx ? 'true' : 'false'));
    const cur = nav.querySelector(`button[data-i="${idx}"]`);
    if (cur && nav.scrollWidth > nav.clientWidth) nav.scrollTo({ left: cur.offsetLeft - nav.clientWidth / 2 + cur.offsetWidth / 2, behavior: 'smooth' });
    try { if (location.hash.slice(1) !== active.id) history.replaceState(null, '', '#' + active.id); } catch (e) {}   // not allowed in srcdoc/sandboxed frames
    handle = active.mount(svg, api) || {};
    // the figure's actions -> buttons (mount returns { actions:[{label, run}] })
    const acts = $('acts');
    acts.innerHTML = '';
    (handle.actions || []).forEach(a => { const b = document.createElement('button'); b.textContent = a.label;
      b.addEventListener('click', () => { a.run(); svg.focus({ preventScroll: true }); }); acts.appendChild(b); });
    // demo(): with ?demo, or on every arrival when GALLERY.autoDemo is true (?still disables)
    const runDemo = /demo/.test(location.search) || (CFG.autoDemo && !/still/.test(location.search));
    if (runDemo && handle.demo) setTimeout(() => handle.demo(), 120);
  }

  // ---------- glow colour choice ----------
  const PALETTES = {
    // [name, dark accent, dark hi, light accent, light hi]
    ember: [['Ember','#ff7a1a','#ffb070','#ff7a1a','#ffb070'], ['Cyan','#22d3ee','#9beefa','#22d3ee','#9beefa'], ['Lime','#a3e635','#d6f79f','#a3e635','#d6f79f'],
            ['Violet','#a78bfa','#d6caff','#a78bfa','#d6caff'], ['Rose','#fb7185','#fdb8c2','#fb7185','#fdb8c2'], ['Ice','#dfe9ef','#ffffff','#1f2937','#3b4656']],
    city:  [['Sodium','#ff9a2e','#ffc77a','#ff9a2e','#ffc77a'], ['Tungsten','#ffd166','#ffe7a8','#ffd166','#ffe7a8'], ['Neon','#ff4fa3','#ff9fcb','#ff4fa3','#ff9fcb'],
            ['Signal','#3ee8a0','#a3f5cf','#3ee8a0','#a3f5cf'], ['Dusk','#6f9dff','#b5ccff','#6f9dff','#b5ccff'], ['Moon','#dfe7f5','#ffffff','#273246','#3d4a61']],
  };
  const ACCENTS = Array.isArray(CFG.palette) ? CFG.palette : (PALETTES[CFG.palette] || PALETTES.ember);
  const vars = (a, hi, dark) => `--accent:${a}; --accent-hi:${hi}; --accent-dim:color-mix(in srgb, ${a} 10%, transparent);` +
    ` --glass-on:color-mix(in srgb, ${a} ${dark ? 9 : 12}%, ${dark ? '#101112' : '#eef0f0'});`;
  const accentCss = ACCENTS.map(([n, da, dh, la, lh]) => { const k = n.toLowerCase();
    return `:root[data-accent="${k}"] { ${vars(da, dh, true)} }
@media (prefers-color-scheme: light) { :root[data-accent="${k}"]:not([data-theme="dark"]) { ${vars(la, lh, false)} } }
:root[data-accent="${k}"][data-theme="light"] { ${vars(la, lh, false)} }`; }).join('\n');
  const accentStyle = document.createElement('style'); accentStyle.textContent = accentCss; document.head.appendChild(accentStyle);
  document.documentElement.dataset.accent = ACCENTS[0][0].toLowerCase();
  // body colours: [name, top, front (lit), mid, side (shaded)]
  const BODIES = CFG.bodies || [
    ['Tomato',  '#f6957b','#ef6a4c','#cf5038','#4a2219'], ['Mustard', '#f8cb5e','#f4b829','#d49c1f','#4e4a18'],
    ['Mint',    '#b2e0c6','#93d3b0','#71b693','#1f4034'], ['Cobalt',  '#9ab9ea','#76a0e2','#5a82c6','#1c2948'],
    ['Blush',   '#f7c0cf','#f3a6bb','#d8869c','#4b2430'] ];
  const sw = $('swatches'), chosen = {};
  sw.innerHTML = BODIES.map(([n, , fr]) => `<button role="radio" data-body="${n.toLowerCase()}" aria-label="${n}" title="${n}" style="--sw:${fr}"><i></i></button>`).join('');
  function setBody(k) {
    const b = BODIES.find(x => x[0].toLowerCase() === (k || '').toLowerCase()) || BODIES[0], r = document.documentElement.style;
    r.setProperty('--c-top', b[1]); r.setProperty('--c-front', b[2]); r.setProperty('--c-mid', b[3]); r.setProperty('--c-side', b[4]);
    sw.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', x.dataset.body === b[0].toLowerCase() ? 'true' : 'false'));
  }
  sw.addEventListener('click', e => { const b = e.target.closest('button[data-body]'); if (!b) return;
    if (active) chosen[active.id] = b.dataset.body; setBody(b.dataset.body); const s = $('stage'); if (s) s.focus({ preventScroll: true }); });

  // per-figure css
  FIGS.forEach(f => { if (f.css) { const st = document.createElement('style'); st.textContent = f.css; document.head.appendChild(st); } });

  // navigation markup
  nav.innerHTML = FIGS.map((f, i) =>
    `<button data-i="${i}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${f.name}</span></button>`).join('');
  // after a nav click, hand keyboard focus to the figure so space/enter go to it, not the button
  const focusStage = () => { const s = $('stage'); if (s) s.focus({ preventScroll: true }); };
  nav.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) { mount(+b.dataset.i); focusStage(); } });
  $('prev').addEventListener('click', () => { mount(idx - 1); focusStage(); });
  $('next').addEventListener('click', () => { mount(idx + 1); focusStage(); });
  window.addEventListener('hashchange', () => { const i = FIGS.findIndex(f => f.id === location.hash.slice(1)); if (i >= 0 && i !== idx) mount(i); });

  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
    if (handle && handle.key && handle.key(e)) { e.preventDefault(); return; }
    if (e.key === 'PageDown') mount(idx + 1);
    if (e.key === 'PageUp') mount(idx - 1);
  });
  window.addEventListener('keyup', e => { if (handle && handle.keyup) handle.keyup(e); });
  window.addEventListener('blur', () => { if (handle && handle.blur) handle.blur(); });

  if (!FIGS.length) {   // nothing registered yet (figures still being built)
    holder.innerHTML = '<p style="display:grid;place-items:center;height:100%;margin:0;letter-spacing:.14em;text-transform:uppercase">No figures yet</p>';
    numEl.textContent = 'Fig —'; return;
  }
  const start = FIGS.findIndex(f => f.id === location.hash.slice(1));
  mount(start >= 0 ? start : 0);
})();

</script>
<style>/* light theme: the same accent as the dark theme, but no ambient glow (halos, bloom, light pools, soft blur) */
  :root[data-theme="light"] .halo, :root[data-theme="light"] #lamp-pool, :root[data-theme="light"] #lamp-bookpool, :root[data-theme="light"] #lamp-cone { display:none !important; }
  :root[data-theme="light"] .top .dot { box-shadow:none; }
  :root[data-theme="light"] .swatches button[aria-checked="true"] i { box-shadow:0 0 0 2px var(--panel), 0 0 0 3px var(--sw); }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .halo, :root:not([data-theme="dark"]) #lamp-pool, :root:not([data-theme="dark"]) #lamp-bookpool, :root:not([data-theme="dark"]) #lamp-cone { display:none !important; }
    :root:not([data-theme="dark"]) .top .dot { box-shadow:none; }
    :root:not([data-theme="dark"]) .swatches button[aria-checked="true"] i { box-shadow:0 0 0 2px var(--panel), 0 0 0 3px var(--sw); }
  }
</style>
<script>/* light theme: the glow filters pass the drawing through unblurred, bloom draws nothing */
(function () {
  var root = document.documentElement, mq = matchMedia('(prefers-color-scheme: light)'), orig = {};
  function apply() {
    var t = root.dataset.theme, light = t === 'light' || (t !== 'dark' && mq.matches);
    ['glow', 'soft', 'bloom'].forEach(function (id) {
      var f = document.getElementById(id); if (!f) return;
      if (!(id in orig)) orig[id] = f.innerHTML;
      f.innerHTML = !light ? orig[id] : id === 'bloom' ? '<feFlood flood-opacity="0"/>' : '<feMerge><feMergeNode in="SourceGraphic"/></feMerge>';
    });
  }
  new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  if (mq.addEventListener) mq.addEventListener('change', apply);
  apply();
})();
</script>
</body>
