<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Microwave</title></head><body>
<script>/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, page shell.
   A figure page loads this file, then calls mountFigure({...}).
   See BRIEF.md for the drawing contract and conventions.
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* VIEW turns the object in 90° steps about a vertical axis through its centre (RC):
   0 = front (+x) and left (+y) faces toward the viewer, 1 = turned once (the +y side becomes the front)…
   Figures keep modelling in their own coordinates; P / Dv / vis / tone / depthOf all apply the turn. */
let VIEW = 0, RC = [0, 0];
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];                 // the views the UI offers: front and back (figures still draw correctly in all four)
const rotV = ([x,y,z]) => { switch (VIEW & 3){ case 1: return [y,-x,z]; case 2: return [-x,-y,z]; case 3: return [-y,x,z]; default: return [x,y,z]; } };
const rotXY = (x,y) => { const r = rotV([x-RC[0], y-RC[1], 0]); return [r[0]+RC[0], r[1]+RC[1]]; };
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso, no turn
const P  = (x,y,z) => { const [a,b] = rotXY(x,y); return [(a-b)*C + OX, (a+b)*S - z + OY]; };
const Dv = (x,y,z) => { const [a,b,c] = rotV([x,y,z]); return [(a-b)*C, (a+b)*S - c]; };
// distance toward the viewer in the current view: draw parts with smaller depth first
const depthOf = p => { const [a,b] = rotXY(p[0],p[1]); return a + b + p[2]; };
// sort [{at:[x,y,z], svg}] back-to-front for the current view and join
const byDepth = parts => parts.filter(Boolean).sort((p,q) => depthOf(p.at) - depthOf(q.at)).map(p => p.svg).join('');
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
const tone  = (n,m) => { const d=dot(rotV(n),L);   return d>-.15 ? m.l : d>-.45 ? m.m : m.d; };   // exterior, follows the sun
const toneI = (n,m) => { const d=dot(rotV(n),LIN); return d>.6 ? m.l : d>.05 ? m.m : m.d; };      // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.4) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=1.2) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=1.2) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
const hullInk = (pts3,w=1.4) => ink(sp(hull(pts3.map(p=>P(...p)))), w);
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=1){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
const txM = (o, U, V) => `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
const castShadow = pts3 => fill(sp(hull(pts3.map(([x,y,z]) => { const [a,b] = rotXY(x,y); return P0(a+z*SH[0], b+z*SH[1], 0); }))), SHADOW);
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all
   figures match the reference zoom of the booth / vending machine (viewBox ≈ 585 units wide). */
const INK_REF_VB = 585;
let INK_K = 1;
const inkScale = svg => INK_K === 1 ? svg : svg.replace(/stroke-width="([\d.]+)"/g, (_, w) => `stroke-width="${(+w * INK_K).toFixed(2)}"`);

/* ---------- page shell ---------- */
const CORE_CSS = `
  :root{--paper:#f2efe7;--ink:#231e16;--muted:#857d6e;--rule:#ddd6c8}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background-color:var(--paper);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .33  .16 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
    overflow-x:hidden;color:var(--ink);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px}
  header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:13px;font-weight:600;margin:0;letter-spacing:.02em} header span{color:var(--muted)}
  #fig{width:100%;max-width:760px;height:auto;display:block;margin:4px 0 8px;user-select:none;overflow:visible}
  #fig [data-act]{cursor:pointer}
  #readout, .idea{display:none}   /* status line + big idea are off: the buttons and motion tell the story */
  .idea{width:100%;max-width:760px;margin:-6px 0 16px;font-size:12.5px;line-height:1.5;text-align:center;color:var(--ink)}
  .idea strong{letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-right:8px}
  #readout{position:relative;min-height:1.4em;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;text-align:center;text-shadow:0 0 3px var(--paper),0 0 6px var(--paper),0 0 10px var(--paper)}
  .stage{position:relative;width:100%;max-width:760px}
  .actions{position:absolute;top:4px;left:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;z-index:2;max-width:220px}
  .actions .cap{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 2px}
  .turn{position:absolute;right:0;bottom:2%;display:flex;align-items:center;gap:8px;z-index:2;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .turn span{min-width:7.5em;text-align:center}
  .tb{font:inherit;font-size:17px;line-height:1;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;padding:0}
  .tb:hover{background:#0000000d}
  #fig{transition:transform .14s ease-in}
  #fig.flip{transform:scaleX(.04)}
  #fig.dragging{cursor:grabbing}
  .stats{position:absolute;top:4px;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:2;text-align:right}
  .stat .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat.small .v{font-size:20px}
  .stat .v.bump{animation:bump .35s ease-out}
  @keyframes bump{0%{transform:scale(1.18)}100%{transform:none}}
  .stepwrap{position:relative;display:flex;align-items:center;gap:8px}
  .act{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap}
  .act:hover{background:color-mix(in srgb,var(--paper) 92%,var(--ink))}
  .act .car{margin-left:6px;font-size:10px}
  .act:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .chips{display:none;flex-wrap:wrap;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);
    padding:8px;width:max-content;max-width:min(300px,62vw);position:absolute;left:calc(100% + 10px);top:-4px;z-index:3}
  .stepwrap.open .chips{display:flex}
  .chip{white-space:nowrap;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:4px 8px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .chip:hover{background:var(--accent,#f4b829);transform:translate(-1px,-1px)}
  .chip:disabled{opacity:.35;cursor:default;transform:none;background:var(--paper)}
  
  @media (max-width:560px){body{padding:14px 12px 24px}header span,.actions .cap{display:none}.actions{flex-direction:row;flex-wrap:wrap;gap:6px}.act{font-size:12px;padding:4px 11px}.turn{position:static;justify-content:flex-end;margin-top:4px}.stats{position:static;flex-direction:row;justify-content:flex-end;gap:18px;margin-bottom:4px}.actions{position:static;max-width:none;margin:6px 0 4px}.chips{left:0;top:calc(100% + 8px)}}
  .controls{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 28px;border-top:1px solid var(--rule);padding-top:16px}
  .ctl{display:flex;flex-direction:column;gap:6px}
  .ctl label{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  input[type=range]{width:100%;accent-color:var(--ink)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
  button:hover{background:#0000000d}
  .sw{width:26px;height:26px;padding:0;border-radius:50%} .sw[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}`;

const filterFor = k => `<filter id="hand" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="${(0.045/k).toFixed(4)}" numOctaves="2" seed="4" result="warp"/>
  <feDisplacementMap id="wob" in="SourceGraphic" in2="warp" scale="${(2.4*k).toFixed(2)}" xChannelSelector="R" yChannelSelector="G" result="wob"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.9/k).toFixed(4)}" numOctaves="3" seed="11" result="n1"/>
  <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .84  .3 0 0 0 .84  .3 0 0 0 .84  0 0 0 0 1" result="grain"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.012/k).toFixed(4)}" numOctaves="2" seed="7" result="n2"/>
  <feColorMatrix in="n2" type="matrix" values=".3 0 0 0 .85  .3 0 0 0 .85  .3 0 0 0 .85  0 0 0 0 1" result="blot"/>
  <feBlend in="wob" in2="grain" mode="multiply" result="g1"/><feBlend in="g1" in2="blot" mode="multiply" result="g2"/>
  <feComposite in="g2" in2="wob" operator="in"/></filter>`;

/* mountFigure({
     fig:'03', title:'Photo booth', hint:'click the curtain…',
     size:[W,D,H],                 // bounding box, used to frame the view (shadow range included)
     palette:'mustard',            // default PALS key
     state:{...},                  // figure state, merged into st (st.pal, st.az are built in)
     scene: (st, m) => svgString,  // m = current palette {l,m,d}
     readout: st => 'text',        // status line under the figure
     buttons: [{label, onClick(st, ui)}      // listed in the order the user should do them; shown numbered
               | {label, choices: st => [{label, onClick(st,ui), disabled?}]}],   // opens a picker
     stats: st => [{label, value, small?}],   // optional: big numbers top-right (credit, change, score)
     views: true,                  // optional: the figure supports turning (VIEW 0..3); adds ⟲ ⟳, drag and Q/E
     center: [x,y],                // optional: turning axis (default: middle of size)
     next: st => index,            // optional: which step is current (-1 while busy)
     acts: { name(st, el, ui){} },  // clicks on act(name, …) groups; el has dataset
     params(st, q){}               // optional: read URLSearchParams for screenshot states
   })  -> ui = { st, render, animate(stepFn), flash(text,ms) }
   animate(step): calls step(dt seconds) every frame and re-renders until step returns false. */
function mountFigure(cfg){
  document.title = cfg.title;
  const style = document.createElement('style'); style.textContent = CORE_CSS; document.head.appendChild(style);
  document.body.innerHTML = `
    <header><h1>Fig. ${cfg.fig} — ${cfg.title}</h1><span>${cfg.hint || ''}</span></header>
    <div class="stage">
      ${cfg.buttons && cfg.buttons.length ? `<div class="actions" id="btns"><div class="cap">${cfg.buttonsLabel || 'Try it'}</div></div>` : ''}
      ${cfg.stats ? '<div class="stats" id="stats"></div>' : ''}
      ${cfg.views ? '<div class="turn"><button class="tb" id="tl" title="Turn around (Q)">⟲</button><span id="vname">front</span><button class="tb" id="tr" title="Turn around (E)">⟳</button></div>' : ''}
      <svg id="fig" role="img" aria-label="${cfg.title}"><defs id="fdefs"></defs><g id="art" filter="url(#hand)"></g></svg>
    </div>
    <div id="readout"></div>
    ${cfg.idea ? `<p class="idea"><strong>The big idea</strong>${cfg.idea}</p>` : ''}
    <div class="controls">
      <div class="ctl"><label for="az">Light direction</label><input id="az" type="range" min="${AZ_MIN}" max="${AZ_MAX}" value="105"></div>
      <div class="ctl"><label for="wb">Hand-drawn wobble</label><input id="wb" type="range" min="0" max="7" step="0.1" value="2.4"></div>
      <div class="ctl"><label>Colour</label><div class="row" id="pals"></div></div>
    </div>`;
  const st = cfg.state || {};            // kept as the same object, so a figure may hold on to it
  if (!st.pal) st.pal = cfg.palette || 'mustard';
  if (st.az == null) st.az = 105;
  const q = new URLSearchParams(location.search);
  if (PALS[q.get('pal')]) st.pal = q.get('pal');
  if (q.has('az')) st.az = Math.min(AZ_MAX, Math.max(AZ_MIN, +q.get('az')));
  if (cfg.params) cfg.params(st, q);
  const view0 = cfg.views && q.has('view') ? (+q.get('view') === 2 ? 2 : 0) : 0;

  // frame on the object itself: centred, filling ~60% of the width / ~78% of the height of a 4:3 view.
  // The cast shadow is allowed to spill outside the frame (svg overflow is visible).
  const [W,D,H] = cfg.size, pts = [];
  OX = OY = 0; RC = cfg.center || [W/2, D/2];
  const turns = cfg.views ? TURNS : [0];
  for (const v of turns){ VIEW = v; for (const x of [0,W]) for (const y of [0,D]) for (const z of [0,H]) pts.push(P(x,y,z)); }
  VIEW = 0;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const bw = Math.max(...xs)-Math.min(...xs), bh = Math.max(...ys)-Math.min(...ys);
  const vbW = Math.max(bw/.6, bh/.78/.75), vbH = vbW*.75;
  OX = (vbW-bw)/2 - Math.min(...xs); OY = vbH*.05 - Math.min(...ys);   // sit a little high: shadows fall downward
  const svg = document.getElementById('fig');
  svg.setAttribute('viewBox', `0 0 ${f(vbW)} ${f(vbH)}`);
  INK_K = vbW / INK_REF_VB;
  document.getElementById('fdefs').innerHTML = filterFor(INK_K);

  const art = document.getElementById('art'), readout = document.getElementById('readout');
  const ui = { st };
  ui.render = () => { _clipN = 0; document.documentElement.style.setProperty('--accent', PALS[st.pal].l); art.innerHTML = inkScale(cfg.scene(st, PALS[st.pal])); if (!ui._flash) readout.textContent = cfg.readout ? cfg.readout(st) : ''; if (ui.drawStats) ui.drawStats(); };
  // big numbers in the top-right corner (credit, change, score…); a value that changes gets a little bump
  const statsEl = document.getElementById('stats'), prevStats = {};
  ui.drawStats = () => { if (!statsEl) return;
    const list = cfg.stats(st).filter(Boolean), html = list.map(x => `<div class="stat${x.small ? ' small' : ''}"><div class="k">${x.label}</div><div class="v" data-k="${x.label}">${x.value}</div></div>`).join('');
    if (statsEl._html !== html){ statsEl._html = html; statsEl.innerHTML = html;
      statsEl.querySelectorAll('.v').forEach(v => { if (prevStats[v.dataset.k] != null && prevStats[v.dataset.k] !== v.textContent) v.classList.add('bump'); prevStats[v.dataset.k] = v.textContent; }); } };
  let flashT = 0;
  ui.flash = (text, ms=1400) => { ui._flash = true; readout.textContent = text; clearTimeout(flashT); flashT = setTimeout(() => { ui._flash = false; ui.render(); }, ms); };
  ui.animate = step => { let last = performance.now();
    const loop = now => { const dt = Math.max(0, Math.min(.05,(now-last)/1000)); /* rAF time can precede the start stamp */ last = now; const more = step(dt) !== false; ui.render(); if (more) requestAnimationFrame(loop); };
    requestAnimationFrame(loop); };

  svg.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a || !cfg.acts || !cfg.acts[a.dataset.act]) return; cfg.acts[a.dataset.act](st, a, ui); ui.render(); });
  const btns = document.getElementById('btns');
  const stepEls = [];
  if (btns) cfg.buttons.forEach((b, i) => {
    const wrap = document.createElement('div'); wrap.className = 'stepwrap';
    const el = document.createElement('button'); el.className = 'act';
    el.innerHTML = `${b.label}${b.choices ? '<span class="car">▾</span>' : ''}`;
    wrap.appendChild(el); btns.appendChild(wrap); stepEls.push(el);
    if (!b.choices){ el.onclick = () => { closeChips(); b.onClick(st, ui); ui.render(); }; return; }
    const chips = document.createElement('div'); chips.className = 'chips'; wrap.appendChild(chips);
    el.onclick = e => { e.stopPropagation(); const open = !wrap.classList.contains('open'); closeChips();
      if (!open) return;
      chips.innerHTML = '';
      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip'; ch.textContent = c.label; ch.disabled = !!c.disabled;
        ch.onclick = ev => { ev.stopPropagation(); closeChips(); c.onClick(st, ui); ui.render(); }; chips.appendChild(ch); }
      wrap.classList.add('open'); };
  });
  function closeChips(){ document.querySelectorAll('.stepwrap.open').forEach(w => w.classList.remove('open')); }
  document.addEventListener('click', closeChips);

  ui.view = () => VIEW;
  if (cfg.views){
    const name = document.getElementById('vname');
    let busy = false;
    const setView = v => { VIEW = ((v % 4) + 4) % 4; name.textContent = VIEW_NAMES[VIEW]; ui.render(); };
    ui.turn = d => { if (busy) return; busy = true; svg.classList.add('flip');
      setTimeout(() => { const i = TURNS.indexOf(VIEW); setView(TURNS[(i + (d > 0 ? 1 : TURNS.length - 1)) % TURNS.length]); svg.classList.remove('flip'); setTimeout(() => busy = false, 150); }, 140); };
    document.getElementById('tl').onclick = () => ui.turn(-1);
    document.getElementById('tr').onclick = () => ui.turn(1);
    addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,textarea')) return;
      if (e.key === 'q' || e.key === 'Q') ui.turn(-1); if (e.key === 'e' || e.key === 'E') ui.turn(1); });
    // drag sideways on the figure to turn it; a real drag swallows the click that follows
    let x0 = null, dragged = false;
    svg.addEventListener('pointerdown', e => { x0 = e.clientX; dragged = false; });
    addEventListener('pointermove', e => { if (x0 == null) return; const dx = e.clientX - x0;
      if (Math.abs(dx) > 70){ dragged = true; svg.classList.add('dragging'); ui.turn(dx > 0 ? -1 : 1); x0 = e.clientX; } });
    addEventListener('pointerup', () => { x0 = null; svg.classList.remove('dragging'); });
    svg.addEventListener('click', e => { if (dragged){ e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);
    VIEW = view0; name.textContent = VIEW_NAMES[VIEW];
  }
  const az = document.getElementById('az'); az.value = st.az;
  az.oninput = e => { st.az = +e.target.value; setLight(st.az); ui.render(); };
  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);
  }
  setLight(st.az); ui.render();
  return ui;
}
</script>
<script>
/* ============================================================
   Fig. 06 — Microwave (retro countertop, 1 unit ≈ 0.5 cm)
   Body x 0..80 (depth), y 0..104 (width), z 4..66 on feet.
   Door on the viewer-RIGHT, hinged at y = 3 so it swings open beside the
   cavity; control panel on the viewer-left.
   ============================================================ */
const W = 80, D = 104, H = 66, ZB = 4, BR = 9;
const OUT = rrUV(0, ZB, D, H, BR);
const CAV = { x0:36, x1:W, y0:5, y1:60, z0:10, z1:58 };          // cooking cavity (opening on the front x = W)
const DOOR = { x0:W, x1:W+3, y0:3, y1:68, z0:8, z1:62, r:4 };
const AX = DOOR.x1, AY = DOOR.y0, DOOR_MAX = 92;                  // hinge axis (outer viewer-right edge of the door)
const WIN = { y0:8, y1:58, z0:14, z1:56, r:3 };                    // window in the door
const TT = { x:62, y:22, z:12, r:16 };                             // turntable centre; plate z 12..12.9
const PLATE_TOP = 12.9;
const PANEL = { y0:71, y1:100, z0:7, z1:62 };
const DIAL = { y:86, z:43.5 };
const SPEED = 15;
const FK = 1.3;                                                    // food scale                                                  // shown seconds per real second
const FOODS = {
  popcorn: { name:'popcorn', label:'POP',   preset:120 },
  soup:    { name:'soup',    label:'SOUP',  preset:90 },
  pizza:   { name:'pizza',   label:'PIZZA', preset:45 },
};
const ORDER = ['popcorn','soup','pizza'];
const GREEN = '#43c25c', RED = '#e2483d';
const PAPER = { l:'#fbf6ea', m:'#e9dfc8', d:'#c4b89a' };
const clamp = (v,a=0,b=1) => Math.max(a, Math.min(b, v));
const hash = k => { const s = Math.sin(k*12.9898 + 78.233)*43758.5453; return s - Math.floor(s); };
const pad2 = n => String(n).padStart(2,'0');
const clock = t => { const s = Math.max(0, Math.ceil(t - 1e-6)); return Math.floor(s/60) + ':' + pad2(s%60); };

/* ---------- small helpers ---------- */
function ring(c, d, r, n=16){
  const a = Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0], u = norm(cross(d,a)), v = cross(d,u);
  return Array.from({length:n}, (_,i) => { const t=i/n*2*Math.PI, cs=Math.cos(t), sn=Math.sin(t);
    return [c[0]+r*(cs*u[0]+sn*v[0]), c[1]+r*(cs*u[1]+sn*v[1]), c[2]+r*(cs*u[2]+sn*v[2])]; });
}
function tube(pts, rs, m, w=1.1, n=16){
  const dirs = pts.map((p,i) => norm(sub(pts[Math.min(i+1,pts.length-1)], pts[Math.max(i-1,0)])));
  const R = pts.map((p,i) => ring(p, dirs[i], rs[i], n));
  let s = '';
  for (let i=0;i<R.length-1;i++) s += loft(R[i], R[i+1], nr => toneI(nr, m));
  const d1 = dirs[dirs.length-1], d0 = dirs[0].map(v=>-v);
  if (vis(d0) && rs[0] > .2) s += fill(pd(R[0]), toneI(d0,m)) + ink(pd(R[0]), w*.7);
  if (vis(d1) && rs[rs.length-1] > .2) s += fill(pd(R[R.length-1]), toneI(d1,m)) + ink(pd(R[R.length-1]), w*.7);
  return s + hullInk(R.flat(), w);
}
// text on any plane: o = baseline centre, eu = reading direction, ev = glyph up (unit 3D vectors)
function txV(o, eu, ev, str, size, col=INK, weight=700, extra=''){
  const [X,Y] = P(...o), a = Dv(...eu), b = Dv(...ev);
  return `<text transform="matrix(${a[0].toFixed(4)} ${a[1].toFixed(4)} ${(-b[0]).toFixed(4)} ${(-b[1]).toFixed(4)} ${f(X)} ${f(Y)})" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em" ${extra}>${str}</text>`;
}
const vsub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
// undo the view turn: the model vector / ground point that ends up at a given turned direction / place
const unV = ([x,y,z]) => { switch (VIEW & 3){ case 1: return [-y,x,z]; case 2: return [-x,-y,z]; case 3: return [y,-x,z]; default: return [x,y,z]; } };
const unXY = (a,b) => { const r = unV([a-RC[0], b-RC[1], 0]); return [r[0]+RC[0], r[1]+RC[1]]; };
// a round flexible line (cord, pin) drawn as an ink stroke under a coloured stroke, d = diameter in model units
const rope = (pts, d, col, hiCol) => { const w = d/INK_K, path = pd(pts, false);
  return `<path d="${path}" fill="none" stroke="${INK}" stroke-width="${(w+1.8).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`
       + `<path d="${path}" fill="none" stroke="${col}" stroke-width="${w.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`
       + (hiCol ? `<path d="${path}" fill="none" stroke="${hiCol}" stroke-width="${(w*.28).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>` : ''); };
// little white puff (popcorn, foam): ink rims under white fills so clusters merge
function puffs(list){
  let rims = '', fills = '', hi = '';
  for (const [c, r] of list){
    const [X,Y] = P(...c), R = r*1.2247;
    for (const [dx,dy,k] of [[0,0,1],[.72,-.3,.8],[-.62,-.42,.78],[.05,.62,.74]]){
      rims  += `<circle cx="${f(X+dx*R*.7)}" cy="${f(Y+dy*R*.7)}" r="${f(R*k*.62+.32)}"/>`;
      fills += `<circle cx="${f(X+dx*R*.7)}" cy="${f(Y+dy*R*.7)}" r="${f(R*k*.62)}"/>`;
    }
    hi += `<circle cx="${f(X-R*.25)}" cy="${f(Y-R*.3)}" r="${f(R*.2)}"/>`;
  }
  return `<g fill="${INK}">${rims}</g><g fill="#fffdf4">${fills}</g><g fill="#f2d98a" opacity=".7">${hi}</g>`;
}

/* ---------- the door: rotation about the vertical hinge axis (AX, AY) ---------- */
const doorAng = st => ease(clamp(st.door)) * DOOR_MAX * Math.PI/180;
function doorXf(th){
  const c = Math.cos(th), s = Math.sin(th);
  return { p: ([x,y,z]) => { const dx = x-AX, dy = y-AY; return [AX + dx*c + dy*s, AY - dx*s + dy*c, z]; },
           n: ([a,b,z]) => [a*c + b*s, -a*s + b*c, z] };
}

/* ---------- food on the turntable: local frame (u, v, z above the plate), rotated by st.rot ---------- */
function foodXf(st, dz=0){
  const a = st.rot, c = Math.cos(a), s = Math.sin(a);
  return ([u,v,z]) => [TT.x + FK*(u*c - v*s), TT.y + FK*(u*s + v*c), PLATE_TOP + FK*z + dz];
}
function steamArt(st, T, top, amt, n=3, len=16){
  if (amt <= .02) return '';
  let s = '';
  const sx = unV([1,-1,0]);                // the ground direction that runs left-right on screen
  for (let k=0;k<n;k++){
    const ph = k*2.1, [bu,bv] = [[-1.6,.8],[.6,-1.5],[1.9,1.4]][k], base = T([bu,bv,top]);
    const pts = [];
    for (let i=0;i<=9;i++){
      const q = i/9, w = Math.sin(q*5.2 - st.t*3.4 + ph)*(.4 + 1.9*q);
      pts.push([base[0] + w*.7*sx[0], base[1] + w*.7*sx[1], base[2] + 1 + q*len*(.85 + .15*Math.sin(st.t*1.3+ph))]);
    }
    const lo = pd(pts.slice(0,6), false), up = pd(pts.slice(5), false);
    s += `<path d="${pd(pts,false)}" fill="none" stroke="${INK}" stroke-width="3.6" stroke-linecap="round" opacity="${f(.16*amt)}"/>`
       + `<path d="${lo}" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" opacity="${f(.9*amt)}"/>`
       + `<path d="${up}" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="${f(.5*amt)}"/>`;
  }
  return `<g pointer-events="none">${s}</g>`;
}

// popcorn bag: a flat folded paper bag that puffs into a pillow; kernels hop while it cooks
function popcornArt(st, T){
  const p = clamp((st.heat - .06)/.72);
  const hl = 9 - .9*p, hw = 5.6 - .4*p, h = 1.1 + 6.6*p;
  const lev = [[0,1],[.2,1+.03*p],[.5,1+.02*p],[.8,1-.13*p],[1,1-.4*p]];
  const rings = lev.map(([k,sc]) => rrUV(-hl*sc, -hw*sc, hl*sc, hw*sc, Math.min(hw*sc*.9, 1 + 3.2*p), 4).map(([u,v]) => T([u,v,h*k])));
  let s = '';
  for (let i=0;i<rings.length-1;i++) s += loft(rings[i], rings[i+1], n => toneI(n, PAPER));
  const top = rings[rings.length-1], sc = lev[lev.length-1][1];
  s += fill(pd(top), PAPER.l) + ink(pd(top), .8);
  // printed red band + POP, fold creases
  const band = rrUV(-hl*sc*.55, -hw*sc*.72, hl*sc*.55, hw*sc*.72, Math.min(hw*sc*.6, 1+2*p), 4).map(([u,v]) => T([u,v,h+.03]));
  s += fill(pd(band), '#d9443a') + ink(pd(band), .6);
  const o = T([0,0,h+.05]), eu = vsub(T([1,0,0]), T([0,0,0])), ev = vsub(T([0,-1,0]), T([0,0,0]));
  const fs = 3.4*sc + .4;
  s += txV(vsub(o, ev.map(v => v*fs*.36)), eu, ev, 'POP', fs.toFixed(2), '#fff7e6', 800);
  for (const k of [-1,1]){ const u = k*hl*sc*.8;
    s += ink(pd([T([u,-hw*sc*.85,h+.04]), T([u,hw*sc*.85,h+.04])], false), .5); }
  if (p > .3){   // puffed: a little crinkle where the paper wrinkles
    s += ink(pd([T([-hl*.95,-hw*.3,h*.55]), T([-hl*.95-.3,0,h*.62]), T([-hl*.95,hw*.3,h*.55])], false), .5);
  }
  s += hullInk(rings.flat(), 1.2);
  // kernels: tiny white blobs that hop out of the bag and drop back in
  if (st.running && st.heat > .1 && st.heat < 1.04){
    const n = 2 + Math.round(6*clamp(st.heat*1.6)), list = [];
    for (let i=0;i<n;i++){
      const per = .42 + .3*hash(i+.13), cyc = st.t/per + hash(i+.57), c = Math.floor(cyc), q = (cyc - c)/.6;
      if (q > 1) continue;
      const u = (hash(i*7.1 + c*.31) - .5)*hl*sc*1.3, v = (hash(i*3.7 + c*.77) - .5)*hw*sc*1.2;
      list.push([T([u, v, h + .6 + 26*q*(1-q)*(.6+.5*hash(i+c))]), .85 + .3*hash(i*2.3)]);
    }
    list.sort((a,b) => depthOf(a[0]) - depthOf(b[0]));
    s += puffs(list);
  }
  return s;
}

// mug of tomato soup: ceramic with a red band and a handle that swings round with the turntable
function soupArt(st, T){
  const r = 5, h = 10.5, MUG = CERAMIC, BAND = matOf('#d9443a');
  const ringL = (z, rr, n=28) => ellUV(0,0,rr,rr,n).map(([u,v]) => T([u,v,z]));
  const A = ringL(0, 4.3), B = ringL(1, 5), B1 = ringL(6.4, 5), B2 = ringL(8, 5), Ct = ringL(h, 5);
  const hp = [[0,r-.4,h-2],[0,r+2.8,h-2.3],[0,r+3.5,h*.5],[0,r+2.6,2.9],[0,r-.4,2.6]].map(T);
  const front = depthOf(T([0,1,0])) - depthOf(T([0,0,0])) > 0;     // handle on the viewer's side of the mug?
  const hw = 1.25*FK/INK_K;
  const handle = `<path d="${pd(hp,false)}" fill="none" stroke="${INK}" stroke-width="${(hw+2.2).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`
               + `<path d="${pd(hp,false)}" fill="none" stroke="${MUG.m}" stroke-width="${hw.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  let s = front ? '' : handle;
  s += loft(A, B, n => toneI(n, MUG)) + loft(B, B1, n => toneI(n, MUG)) + loft(B1, B2, n => toneI(n, BAND)) + loft(B2, Ct, n => toneI(n, MUG));
  s += hullInk([...A, ...Ct], 1.2);
  // band edges (front halves only)
  s += bandLines(B1, T) + bandLines(B2, T);
  // rim, inside, soup
  const inner = ringL(h, r-.6);
  s += fill(pd(Ct), MUG.l);
  let inside = fill(pd(inner), MUG.d);
  const zl = h - 1.5, surf = ringL(zl, r-.65);
  const soup = st.heat > .5 ? '#d8582c' : '#d9662f';
  inside += fill(pd(surf), soup);
  inside += fill(pd(ellUV(-1.2,.9,2.2,1.1,16).map(([u,v]) => T([u,v,zl+.02]))), '#ec8a4c', 'opacity=".8"');
  inside += fill(pd(ellUV(1.6,-1.4,.9,.6,12).map(([u,v]) => T([u,v,zl+.03]))), '#f6c08a', 'opacity=".9"');
  if (st.running && st.heat > .35){   // simmer bubbles
    let b = '';
    for (let i=0;i<4;i++){ const q = (st.t*1.4 + hash(i)) % 1, a = hash(i+.4)*6.28, d = 2.6*hash(i+.8), rr = .25 + .5*q;
      b += pd(ellUV(Math.cos(a)*d, Math.sin(a)*d, rr, rr, 10).map(([u,v]) => T([u,v,zl+.05]))); }
    inside += `<path d="${b}" fill="#f0a070" stroke="#a8401d" stroke-width=".4"/>`;
  }
  s += clipTo(inner, inside);
  s += ink(pd(Ct), .9) + ink(pd(inner), .6);
  if (front) s += handle;
  return s;
}
function bandLines(rg, T){
  // ink only the half of a horizontal ring that faces the viewer
  const c = avg(rg), kk = p => depthOf(p) - depthOf(c) - (p[2]-c[2]), pts = rg.map(p => ({ p, k: kk(p) }));
  let best = 0; for (let i=0;i<pts.length;i++) if (pts[i].k < pts[best].k) best = i;
  const n = rg.length, seq = []; for (let i=0;i<=n;i++){ const q = pts[(best+i)%n]; seq.push(q.p); }
  // the visible half runs between the two silhouette points (k ≈ 0) through k > 0
  const vis = seq.filter(p => kk(p) >= -.4);
  return vis.length > 1 ? ink(pd(vis, false), .6) : '';
}

// slice of pizza: dough wedge, cheese, pepperoni, a crust tube; cheese bubbles when hot
function pizzaArt(st, T){
  const th = 1.1, AP = -9.5, RAD = 16.5, HALF = 27;
  const outline = [[AP+.2,0], ...arcUV(AP, 0, RAD, -HALF, HALF, 12)];
  const A = outline.map(([u,v]) => T([u,v,0])), B = outline.map(([u,v]) => T([u,v,th]));
  const DOUGH = matOf('#e9c68f'), CRUST = matOf('#d99b52');
  let s = loft(A, B, n => toneI(n, DOUGH)) + fill(pd(B), DOUGH.l) + hullInk([...A, ...B], 1.1);
  const g = clamp((st.heat - .55)/.5), cheese = mix('#f7d25a', '#eba53c', g);
  const ch = [[AP+1.4,0], ...arcUV(AP, 0, RAD-1.6, -HALF+3, HALF-3, 12)].map(([u,v]) => T([u,v,th+.05]));
  s += fill(pd(ch), cheese) + ink(pd(ch), .5).replace(INK, mix(cheese, '#000000', .35));

  for (const [u,v] of [[-4.2,.6],[.6,-3.1],[2,3]]){

  const cp = arcUV(AP, 0, RAD-.6, -HALF-1, HALF+1, 12).map(([u,v]) => T([u,v,th+.4]));
  const rs = cp.map((_,i) => { const k = Math.sin(Math.PI*i/(cp.length-1)); return (.8 + .85*Math.pow(k,.4))*FK; });

}
const FOOD_ART = { popcorn: popcornArt, soup: soupArt, pizza: pizzaArt };
const FOOD_FOOT = { popcorn:[9.6,6.2], soup:[5.4,5.4], pizza:[11,8] };

/* ---------- cavity: walls, lamp, turntable, food ---------- */
function cavityArt(st){

  // the side wall we look at: the right one (y0, faces +y) or, turned, the left one behind the panel (y1, faces −y)
  const rightWall = facing([0,1,0]), yw = rightWall ? y0 : y1;
  s += fill(pd([[x0,yw,z0],[x1,yw,z0],[x1,yw,z1],[x0,yw,z1]]), col('#a6a190','#f9e6a0'));          // side wall
  s += fill(pd([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]]), col('#827d6e','#e6c96c'));          // floor
  s += line([[x0,yw,z0],[x0,yw,z1]], .9) + line([[x0,y0,z0],[x0,y1,z0]], .9) + line([[x0,yw,z0],[x1,yw,z0]], .9);

    s += shape(on(PY(y0+.1), rrUV(70, 37, 78, 45, 1)), lampOn ? mix('#d8d2bf', '#fff6c8', Lt) : '#bcb6a3', .7);
    let holes = '';
    for (let x = 71.5; x < 77.5; x += 1.6) for (let z = 38.5; z < 44.5; z += 1.6) holes += pd(on(PY(y0+.2), ellUV(x, z, .35, .35, 6)));
    s += `<path d="${holes}" fill="${lampOn ? '#e0a93a' : '#6c6656'}"/>`;

  s += ink(pd(roll), 2.2).replace(INK, col('#5a5548','#b89a45'));

  const pA = on(PZ(TT.z), ellUV(TT.x, TT.y, TT.r-.4, TT.r-.4, 40)), pB = on(PZ(PLATE_TOP), ellUV(TT.x, TT.y, TT.r, TT.r, 40));
  let pl = `<g opacity=".82">${loft(pA, pB, n => toneI(n, GL))}${fill(pd(pB), GL.l)}</g>`;
  pl += ink(pd(on(PZ(PLATE_TOP+.02), ellUV(TT.x, TT.y, TT.r-1.6, TT.r-1.6, 40))), .45).replace(INK, '#7f9fa6');
  pl += hullInk([...pA, ...pB], 1.1) + ink(pd(pB), .8);
  // rim marks show it turning
  for (let k=0;k<8;k++){ const a = st.rot + k*Math.PI/4;
    pl += fill(pd(on(PZ(PLATE_TOP+.03), ellUV(TT.x + (TT.r-.85)*Math.cos(a), TT.y + (TT.r-.85)*Math.sin(a), .42, .42, 8))), '#93b3b9'); }
  pl += fill(pd(on(PZ(PLATE_TOP+.03), [[TT.x+3,TT.y+6],[TT.x+4,TT.y+8.5],[TT.x-5,TT.y+10.5],[TT.x-6,TT.y+9]])), '#ffffff', 'opacity=".55"');
  s += act('plate', pl);

/* ---------- ding! ---------- */
function dingArt(st){
  if (st.ding == null) return '';

  const bx = W+8, by = 90, bz = 94, rock = Math.sin(t*15)*Math.exp(-t*1.6)*.42;
  const rot = ([u,v]) => { const c = Math.cos(rock), s = Math.sin(rock); return [by + u*c - v*s, bz + u*s + v*c]; };

  // the bell hangs on a sheet that always faces the viewer, at the same spot on screen in every view
  const U = unV([0,1,0]), [ax, ay] = unXY(bx, by);
  const pl = ([u,v]) => [ax + (u-by)*U[0], ay + (u-by)*U[1], v], tr = uv => on(pl, uv.map(rot));
  let s = '';
  const cl = tr([[Math.sin(t*15+1)*1.2, -10.6*K]])[0];
  s += `<circle cx="${f(P(...cl)[0])}" cy="${f(P(...cl)[1])}" r="${f(1.3*K)}" fill="#c8941c" stroke="${INK}" stroke-width="1"/>`;
  s += shape(tr(outline), '#f2c230', 1.3);
  s += fill(pd(tr([[-1.6*K,-1.4*K],[-1*K,-1.2*K],[-1.9*K,-6.6*K],[-2.6*K,-6.6*K]])), '#fff3c4', 'opacity=".8"');
  s += ink(pd(tr([[-4.2*K,-7.4*K],[4.2*K,-7.4*K]]), false), .7);
  const kn = tr([[0, .9*K]])[0], [kX,kY] = P(...kn);
  s += `<circle cx="${f(kX)}" cy="${f(kY)}" r="${f(1*K*1.1)}" fill="#f2c230" stroke="${INK}" stroke-width="1"/>`;
  // sound arcs on both sides
  for (let i=0;i<3;i++){
    const ph = clamp(t*2.2 - i*.25), a = ph * (1 - clamp((t - 1.2 - i*.15)/.6));
    if (a <= .02) continue;
    const r = 10.5 + i*3.6 + ph*1.8;
    for (const [a0,a1] of [[-32,32],[148,212]])

  }

  s += txV(pl([by, bz + 5.2]), U.map(v => -v), [0,0,1], 'DING!', (6.4*pop).toFixed(2), '#d9443a', 900);
  return `<g pointer-events="none" opacity="${f(op)}">${s}</g>`;
}

  s += btx(28, 42.2, '230V ~ 800W', 2.9, INK, 900);
  s += btx(28, 39.1, '50Hz · S/N 06-1984', 1.35, '#5b5548', 700);
  // warning sticker: yellow, with a triangle
  s += shape(on(Bt, rrUV(12, 17, 44, 33, 1)), '#f2c230', .9);
  s += shape(on(PX(-.4), [[15.2, 20],[21.6, 20],[18.4, 30.2]]), '#f2c230', .9);
  s += btx(18.4, 21.2, '!', 4.2, INK, 900);
  s += btx(32.6, 28.4, 'CAUTION', 2.3, INK, 900);
  s += btx(32.6, 24.9, 'HIGH VOLTAGE', 1.4, INK, 800);
  s += btx(32.6, 22.4, 'DO NOT REMOVE', 1.4, INK, 800);
  s += btx(32.6, 19.9, 'COVER', 1.4, INK, 800);
  s += ink(pd(on(B, OUT)), 2.2);
  return s;
}
function sideRArt(m){
  const Ro = PY(-.2), Rt = PY(-.35), rt = tone([0,-1,0], m);
  let s = '';
  // louvred vent panel near the back
  s += shape(on(Ro, rrUV(7, 25, 37, 57, 4)), mix(rt, '#000000', .08), 1.1);
  let lv = ''; for (let z = 29; z <= 53.5; z += 3.5) lv += pd([[11,-.4,z],[33,-.4,z]], false);
  s += `<path d="${lv}" fill="none" stroke="${INK}" stroke-width="1.5" stroke-linecap="round" opacity=".72"/>`;
  // a low row of round air holes along the cavity side
  let hl = ''; for (let x = 42; x <= 74; x += 3.2) for (const z of [11, 14.2]) hl += pd(on(Rt, ellUV(x + (z > 12 ? 1.6 : 0), z, .75, .75, 10)));
  s += `<path d="${hl}" fill="${mix(m.d, '#000000', .25)}" stroke="${INK}" stroke-width=".45"/>`;
  for (const [u,v] of [[4.5,12],[4.5,H-8]]) s += screw(Rt, u, v, 1.1);
  return s;
}
// mains cord: strain-relief bush on the back, drops to the floor and ends in a two-pin plug
function cordArt(){
  const { y:cy, z:cz } = CORD;
  const bush = (() => { const A = on(PX(0), ellUV(cy, cz, 2, 2, 16)), Bq = on(PX(-2.6), ellUV(cy, cz, 1.6, 1.6, 16));
    return loft(A, Bq, n => toneI(n, DARK)) + (facing([-1,0,0]) ? fill(pd(Bq), DARK.m) + ink(pd(Bq), .7) : '') + hullInk([...A, ...Bq], .9); })();
  const path = [[-2.6,cy,cz],[-5.6,cy,cz-1.2],[-8,cy-.8,cz-5],[-9.6,cy-2.2,cz-11.4],[-11.2,cy-4.6,1.4],[-13.4,cy-9,1],[-16,cy-14,1],[-18,cy-18,1],[-19,cy-19.5,1]];
  const cord = rope(path, 1.7, '#3d3935', '#6e675e');
  const py = cy - 19.5, plug = box(-25.5, py-2.6, 0, -19, py+2.6, 4.4, DARK, toneI, .9)
    + ink(pd([[-21,py-2.6,4.45],[-21,py+2.6,4.45]], false), .5) + ink(pd([[-22.4,py-2.6,4.45],[-22.4,py+2.6,4.45]], false), .5);
  const pins = rope([[-25.5,py-1.2,2.2],[-29.2,py-1.2,2.2]], .9, METAL.m) + rope([[-25.5,py+1.2,2.2],[-29.2,py+1.2,2.2]], .9, METAL.m);
  // the cord meets the plug's +x end, the pins stick out of its −x end
  const end = facing([1,0,0]) ? pins + plug + cord : cord + plug + pins;
  return `<g pointer-events="none">${bush}${end}</g>`;
}

/* ---------- scene ---------- */
function scene(st, m){
  let s = `<filter id="mwG" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.6"/></filter>`;
  const th = doorAng(st), open = th > .02, XD = doorXf(th);
  const bodyPts = [...on(PX(0), OUT), ...on(PX(W), OUT)];
  // shadows: body, and the swung door on its own
  s += castShadow(bodyPts);
  if (open) s += castShadow([[DOOR.x0,DOOR.y0,DOOR.z0],[DOOR.x1,DOOR.y0,DOOR.z0],[DOOR.x0,DOOR.y1,DOOR.z0],[DOOR.x1,DOOR.y1,DOOR.z0],
                             [DOOR.x0,DOOR.y0,DOOR.z1],[DOOR.x1,DOOR.y0,DOOR.z1],[DOOR.x0,DOOR.y1,DOOR.z1],[DOOR.x1,DOOR.y1,DOOR.z1]].map(XD.p));
  // Painter's order across views. Everything on the front (cavity, panel, dial, door — open or shut) lives in x ≥ W
  // and the body in x ≤ W, so the front plane separates them: front facing → draw them after the body, else before it
  // (the body hides them; an open door sticking out past the silhouette still shows). Same for the cord behind x = 0.
  const FF = facing([1,0,0]), FB = facing([-1,0,0]);
  const doorS = act('door', doorArt(st, m)), cordS = cordArt();
  if (!FB) s += cordS;
  if (!FF) s += doorS;
  // feet
  for (const [x,y] of [[8,10],[8,94],[72,94],[72,10]]) s += cyl(x, y, 0, ZB+.5, 3, DARK, toneI, 1, 16);
  // body shell
  s += extrude(OUT, 0, W, m);
  if (facing([0,1,0])){
    const sideM = tone([0,1,0], m);
    let vents = ''; for (let z = 30; z <= 54; z += 4) vents += pd([[9,D+.2,z],[34,D+.2,z]], false);
    s += `<path d="${vents}" fill="none" stroke="${INK}" stroke-width="1.5" stroke-linecap="round" opacity=".72"/>`;
    s += shape(on(PY(D+.2), rrUV(44, 26, 72, 40, 7)), mix(sideM, '#ffffff', .14), 1.1);
    s += txY(58, D+.3, 31.2, 'RETRO', 4.4, mix(sideM, '#000000', .4), 800);
  }
  if (facing([0,-1,0])) s += sideRArt(m);
  let tv = ''; for (let x = 8; x <= 22; x += 3.5) tv += pd([[x,62,H+.1],[x,94,H+.1]], false);
  s += `<path d="${tv}" fill="none" stroke="${INK}" stroke-width="1.3" stroke-linecap="round" opacity=".6"/>`;
  if (FB) s += backArt(m) + cordS;
  if (FF){
    // cavity (seen through the window or the open door)
    const opening = on(PX(W), rectUV(CAV.y0, CAV.z0, CAV.y1, CAV.z1));
    s += clipTo(opening, cavityArt(st));
    // front face with the cavity opening
    const F = PX(W);
    s += `<path d="${pd(on(F, OUT))}${pd(opening)}" fill="${tone([1,0,0], m)}" fill-rule="evenodd"/>`;
    s += ink(pd(opening), 1.6);
    for (const z of [22, 48]) s += shape(on(PX(W+.05), rrUV(63.8, z-1.3, 67, z+1.3, .5)), mix(tone([1,0,0], m), '#000000', .5), .6);   // latch slots
    // panel (y ≥ 71) and door (y ≤ 71) never overlap on screen in the views where the front shows
    s += panelArt(st);
    s += ink(pd(on(F, OUT)), 2.2);
    // door
    s += doorS;
    // glow around the window when lit and closed
    const glow = st.lit * (open ? 0 : 1);
    if (glow > .02){
      const wr = on(PX(DOOR.x1+.2), rrUV(WIN.y0, WIN.z0, WIN.y1, WIN.z1, WIN.r));
      s += `<g pointer-events="none" filter="url(#mwG)"><path d="${pd(wr)}" fill="none" stroke="#ffd35a" stroke-width="5" opacity="${f(.55*glow)}"/></g>`;
    }
  }
  // silhouette
  s += hullInk(open ? bodyPts : [...bodyPts, ...on(PX(DOOR.x1), rrUV(DOOR.y0, DOOR.z0, DOOR.y1, DOOR.z1, DOOR.r))], 2.8);
  s += dingArt(st);
  return s;
}

/* ---------- behaviour ---------- */
let UI = null;
function kick(){ const st = UI.st; if (st._run) return; st._run = true; UI.animate(dt => { const more = step(st, dt); if (!more) st._run = false; return more; }); }
function step(st, dt){
  let a = false;
  st.t += dt;
  // door swing
  if (st.door !== st.doorTarget){ const sg = Math.sign(st.doorTarget - st.door); st.door += sg*dt/.7;
    if ((st.doorTarget - st.door)*sg <= 0) st.door = st.doorTarget; a = true; }
  // cooking
  if (st.running){
    const shown = dt*SPEED;
    st.time -= shown; st.rot += dt*2*Math.PI/5; st.cool = 0;
    if (st.food) st.heat = Math.min(1.25, st.heat + shown/FOODS[st.food].preset);
    if (st.time <= 0){ st.time = 0; st.running = false; st.done = true; st.ding = 0;
      UI.flash(st.food ? `DING! ${cap(st.food)} is ready — open the door` : 'DING!', 2200); }
    a = true;
  } else if (st.heat > .4 && st.cool < 30){ st.cool += dt; a = true; }
  if (st.ding != null){ st.ding += dt; if (st.ding > 2.4) st.ding = null; a = true; }
  if (st.foodAnim){ st.foodAnim.t += dt/.6; a = true;
    if (st.foodAnim.t >= 1){ if (st.foodAnim.kind === 'out'){ st.food = null; st.heat = 0; st.cool = 0; st.done = false; } st.foodAnim = null; } }
  // interior lamp
  const lt = (st.running || st.door > 0 || st.doorTarget > 0 || (st.ding != null && st.ding < 1.4)) ? 1 : 0;
  if (Math.abs(st.lit - lt) > .01){ st.lit += (lt - st.lit)*Math.min(1, dt*6); a = true; } else st.lit = lt;
  return a;
}
const cap = s => s[0].toUpperCase() + s.slice(1);
let pressT = 0;
const press = (st, id) => { st.press = id; clearTimeout(pressT); pressT = setTimeout(() => { st.press = null; UI.render(); }, 170); };
function setFood(st, ui, food, viaPreset){
  if (st.running) return ui.flash('Cooking — press STOP first');
  st.food = food; st.heat = 0; st.cool = 0; st.done = false; st.ding = null; st.paused = false;
  st.time = FOODS[food].preset; st.foodAnim = { kind:'in', t:0 }; kick();
}
function nextFood(st, ui){ const i = st.food ? ORDER.indexOf(st.food) : (st.lastFood != null ? ORDER.indexOf(st.lastFood) : -1); setFood(st, ui, ORDER[(i+1) % ORDER.length]); }
function addTime(st){ st.time = Math.min(599, st.time + 30); if (st.done){ st.done = false; } }
function start(st, ui){
  if (st.door > 0 || st.doorTarget > 0) return ui.flash('Close the door first');
  if (!st.food) return ui.flash('Nothing inside — pick a food first');
  if (st.running) return;
  if (st.time <= 0) st.time = 30;
  st.running = true; st.paused = false; st.done = false; st.ding = null; kick();
}
function stop(st){
  if (st.running){ st.running = false; st.paused = true; kick(); return; }
  st.time = 0; st.paused = false; st.done = false; st.ding = null;
}
function toggleDoor(st, ui){
  if (st.doorTarget === 0){
    if (st.running){ st.running = false; st.paused = true; ui.flash('Door opened — cooking paused'); }
    st.doorTarget = 1; st.done = false; st.ding = null;
  } else st.doorTarget = 0;
  kick();
}
function clickFood(st, ui){
  if (st.foodAnim) return;
  if (st.doorTarget === 1 && st.door > .5){
    st.lastFood = st.food; st.foodAnim = { kind:'out', t:0 };
    ui.flash(st.heat > .9 ? `Enjoy your ${st.food}!` : st.heat > .2 ? `Took out the ${st.food} (only half cooked)` : `Took out the ${st.food}`, 1600);
    kick(); return;
  }
  if (st.running) return ui.flash('Hands off — it\'s cooking');
  nextFood(st, ui);
}
function clickPlate(st, ui){
  if (st.food) return clickFood(st, ui);
  if (st.doorTarget === 1) return nextFood(st, ui);
  ui.flash('Open the door to put food in');
}

UI = mountFigure({
  fig:'05', title:'Microwave', hint:'pick a food, add time, START — then open the door to take it out',
  idea:"Microwaves make the water inside food jiggle, and jiggling makes heat. The plate turns so every side gets its turn.",
  size:[100, D, H], palette:'mint', views:true,
  state:{ food:'popcorn', heat:0, time:FOODS.popcorn.preset, running:false, paused:false, done:false, ding:null,
          door:0, doorTarget:0, rot:.35, lit:0, t:0, cool:0, foodAnim:null, press:null, lastFood:null },
  scene,
  readout: st => {
    if (st.ding != null) return `DING! ${st.food ? cap(st.food) + ' is ready' : 'Done'} — open the door`;
    if (st.running){ const n = 3 + Math.floor((st.t*5) % 4); return `Cooking ${st.food} · ${clock(st.time)} left · ~ h${'m'.repeat(n)}${'m'.repeat(6-n).replace(/m/g,' ')} ~`; }
    if (st.door > .02 || st.doorTarget){
      if (st.foodAnim && st.foodAnim.kind === 'in') return `Putting in the ${st.food}…`;
      if (!st.food) return 'Door open · empty turntable — click it to put food in';
      return `Door open · ${st.food}${st.heat > .9 ? ' (hot!)' : st.paused ? ' (half cooked)' : ''} — click it to take it out, or close the door`;
    }
    if (!st.food) return 'Empty — open the door and click the turntable, or pick POP / SOUP / PIZZA';
    if (st.done) return `${cap(st.food)} is ready — press DOOR OPEN`;
    if (st.paused) return `Paused · ${clock(st.time)} left — START to resume, STOP to clear`;
    if (st.time <= 0) return `${cap(st.food)} inside — add time (+30s / dial), then START`;
    return `${cap(st.food)} inside · set ${clock(st.time)} — press START`;
  },
  buttonsLabel:'Microwave',
  buttons:[
    { label:'Choose food', choices: st => ORDER.map(k => ({ label:`${k} · ${Math.floor(FOODS[k].preset/60)}:${String(FOODS[k].preset%60).padStart(2,'0')}`,
        disabled: st.running, onClick:(st, ui) => setFood(st, ui, k) })) },
    { label:'Add 30 s', onClick:(st) => addTime(st) },
    { label:'Start', onClick:start },
    { label:'Stop', onClick:(st) => stop(st) },
    { label:'Open door', onClick:(st, ui) => st.doorTarget ? ui.flash('The door is open') : toggleDoor(st, ui) },
    { label:'Take food out', onClick:(st, ui) => !st.food ? ui.flash('Nothing inside') : st.doorTarget !== 1 ? ui.flash('Open the door first') : clickFood(st, ui) },
    { label:'Close door', onClick:(st, ui) => st.doorTarget ? toggleDoor(st, ui) : ui.flash('The door is closed') },
  ],
  next: st => st.foodAnim || st.door !== st.doorTarget ? -1
    : st.doorTarget === 1 ? (st.food ? 5 : 6)
    : st.running ? -1
    : !st.food ? 0
    : st.done || st.heat > .9 ? 4 : 2,
  acts:{
    food:(st, el, ui) => clickFood(st, ui),
    plate:(st, el, ui) => clickPlate(st, ui),
    door:(st, el, ui) => toggleDoor(st, ui),
    release:(st, el, ui) => { press(st, 'release'); toggleDoor(st, ui); },
    start:(st, el, ui) => { press(st, 'start'); start(st, ui); },
    stop:(st, el, ui) => { press(st, 'stop'); stop(st); },
    add:(st, el, ui) => { press(st, 'add'); addTime(st); },
    dial:(st, el, ui) => addTime(st),
    p_popcorn:(st, el, ui) => { press(st, 'p_popcorn'); setFood(st, ui, 'popcorn', true); },
    p_soup:(st, el, ui) => { press(st, 'p_soup'); setFood(st, ui, 'soup', true); },
    p_pizza:(st, el, ui) => { press(st, 'p_pizza'); setFood(st, ui, 'pizza', true); },
  },
  params(st, q){
    const fd = q.get('food');
    if (fd === 'none') st.food = null;
    else if (FOODS[fd]){ st.food = fd; st.time = FOODS[fd].preset; }
    if (q.has('time')) st.time = clamp(+q.get('time'), 0, 599);
    if (q.has('heat')) st.heat = clamp(+q.get('heat'), 0, 1.25);
    if (q.has('rot')) st.rot = +q.get('rot');
    if (q.get('run') === '1' && st.food){
      const t = q.has('t') ? clamp(+q.get('t')) : .5;
      st.running = true; st.heat = t; st.time = FOODS[st.food].preset*(1-t); st.lit = 1; st.t = .37; st.rot = 1.15; st._frozen = true;
    }
    if (q.get('done') === '1' && st.food){ st.heat = 1; st.time = 0; st.done = true; st.ding = +(q.get('ding') || .32); st.lit = 1; st.rot = 2.2; st.t = 1.1; }
    if (q.get('door') === 'open' || q.get('door') === '1'){ st.door = st.doorTarget = 1; st.lit = 1; st.ding = null; st.running = false; }
  },
});
</script></body></html>
